const DAY = 86400000;
const pad = (n) => String(n).padStart(2, "0");
const toIso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromIso = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const isoIn = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return toIso(d); };
const TODAY = isoIn(0);
const diffDays = (a, b) => Math.round((fromIso(b) - fromIso(a)) / DAY);
const longDate = (s) => fromIso(s).toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
const shortDate = (s) => fromIso(s).toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" });

const plural = (n, w) => `${n} ${w}${n > 1 ? "s" : ""}`;
function mentorOrder(items, tone = "strict") {
  const pending = items.filter((i) => !i.done && !isDeadline(i));
  const overdue = pending.filter((i) => i.date < TODAY).sort((a, b) => a.date.localeCompare(b.date));
  const deadlines = items.filter((i) => isDeadline(i) && i.date >= TODAY).sort((a, b) => a.date.localeCompare(b.date));
  const next = deadlines[0];
  const todayTasks = pending.filter((i) => i.date === TODAY);
  const nextIn = next ? diffDays(TODAY, next.date) : null;
  const strict = tone === "strict";

  if (overdue.length) {
    const o = overdue[0], late = diffDays(o.date, TODAY);
    return { task: o,
      order: strict ? `Terminez « ${o.title} » avant toute autre chose.` : `Commencez par « ${o.title} », qui est en retard.`,
      why: strict
        ? `En retard depuis ${plural(late, "jour")}.${next ? ` ${next.title} dans ${nextIn} jours : chaque retard se paie le jour J.` : ""}`
        : `Prévue il y a ${plural(late, "jour")}. La rattraper maintenant allège le reste de la semaine.` };
  }
  if (todayTasks.length) {
    const t = todayTasks.find((i) => next && i.matiere === next.matiere) || todayTasks[0];
    const rest = todayTasks.length - 1;
    return { task: t,
      order: strict ? `Aujourd'hui : « ${t.title} ». Rien d'autre tant que ce n'est pas fait.` : `Priorité du jour : « ${t.title} ».`,
      why: [next && `${next.title} dans ${plural(nextIn, "jour")}.`, rest > 0 && `Puis ${plural(rest, "autre tâche")} aujourd'hui.`].filter(Boolean).join(" ") };
  }
  if (next && nextIn <= 14) {
    return { plan: true,
      order: strict ? `Rien n'est prévu aujourd'hui et « ${next.title} » tombe dans ${nextIn} jours. Planifiez vos séances maintenant.`
                    : `« ${next.title} » arrive dans ${nextIn} jours et rien n'est prévu aujourd'hui. Planifions quelques séances.`,
      why: strict ? "Un jour sans plan est un jour perdu." : "Quelques séances courtes suffisent pour démarrer." };
  }
  return {
    order: strict ? "Calendrier dégagé. Avancez une fiche d'arrêt aujourd'hui, même courte." : "Rien d'urgent aujourd'hui. Une fiche d'arrêt courte serait un bon usage de votre temps.",
    why: next ? `Prochaine échéance : ${next.title}, dans ${nextIn} jours.` : "" };
}

function streakOf(items) {
  const days = new Set(items.filter((i) => i.done && !isDeadline(i)).map((i) => i.doneOn || i.date));
  const validatedToday = days.has(TODAY);
  let n = 0, d = validatedToday ? 0 : -1;
  while (days.has(isoIn(d))) { n++; d--; }
  const week = Array.from({ length: 7 }, (_, i) => days.has(isoIn(i - 6)));
  return { n, validatedToday, week };
}

function CopyButton({ text, targetRef }) {
  const [state, setState] = useState("idle");
  const onClick = async () => {
    try { await navigator.clipboard.writeText(text); setState("done"); }
    catch {
      const el = targetRef.current;
      if (el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
      setState("select");
    }
    setTimeout(() => setState("idle"), 2200);
  };
  return html`<button onClick=${onClick} disabled=${!text}
    class="mono text-xs px-2.5 py-1.5 rounded-[10px] border border-line hover:border-line2 hover:text-txt text-muted disabled:opacity-40">
    ${{ idle: "Copier", done: "✓ Copié", select: "Sélectionné · ⌘C" }[state]}</button>`;
}

function statusOf(it) {
  if (it.done) return "done";
  return it.date < TODAY ? "late" : "todo";
}

function dayState(list, iso) {
  if (list.some(isDeadline)) return "deadline";
  const tasks = list.filter((i) => !isDeadline(i));
  if (tasks.some((t) => statusOf(t) === "late")) return "late";
  if (tasks.length && tasks.every((t) => t.done)) return "done";
  if (tasks.some((t) => t.done)) return "partial";
  if (tasks.length && iso >= TODAY) return "todo";
  return iso < TODAY ? "past" : "empty";
}

function Tracker({ items, selected, setSelected }) {
  const byDate = useMemo(() => {
    const m = {};
    for (const it of items) (m[it.date] ||= []).push(it);
    return m;
  }, [items]);
  const [hover, setHover] = useState(null);
  const now = fromIso(TODAY);
  const startY = now.getMonth() >= 8 ? now.getFullYear() : now.getFullYear() - 1;
  const months = Array.from({ length: 12 }, (_, i) => new Date(startY, 8 + i, 1));
  const focus = hover || selected;
  const focusList = byDate[focus] || [];
  const focusState = dayState(focusList, focus);
  const summary = focusList.length
    ? [focusList.find(isDeadline)?.title, `${focusList.filter((i) => !isDeadline(i)).length} tâche(s)`].filter(Boolean).join(" · ")
    : "rien de prévu";

  return html`<section aria-labelledby="trk-h" class="rounded-2xl border border-line bg-panel px-5 sm:px-7 py-4 flex flex-col gap-3.5">
    <div class="flex flex-wrap items-baseline justify-between gap-x-4 gap-y-2">
      <h2 id="trk-h" class="eyebrow">Année ${startY}–${startY + 1}</h2>
      <div class="flex flex-wrap gap-x-3 gap-y-1 mono text-[10.5px] text-muted">
        ${[["deadline", "échéance / retard"], ["done", "validé"], ["todo", "à faire"], ["empty", "libre"]].map(([k, l]) => html`<span key=${k} class="inline-flex items-center gap-1.5">
          <span class="sq" style=${CELL[k]}></span>${l}</span>`)}
      </div>
    </div>
    <div class="flex flex-wrap justify-center gap-x-5 gap-y-3" role="grid" aria-label="Tracker annuel">
      ${months.map((first) => {
        const y = first.getFullYear(), m = first.getMonth();
        const offset = (first.getDay() + 6) % 7;
        const daysIn = new Date(y, m + 1, 0).getDate();
        const isCurrent = y === now.getFullYear() && m === now.getMonth();
        return html`<div key=${m} class="flex flex-col gap-1.5" role="row">
          <span class="mono text-[10.5px] leading-none tracking-wide ${isCurrent ? "text-brass font-medium" : "text-muted"}">${first.toLocaleDateString("fr-FR", { month: "short" }).replace(".", "")}</span>
          <div class="grid grid-cols-7 gap-[2px]">
            ${Array.from({ length: offset }, (_, i) => html`<span key=${"o" + i} class="w-[9px] h-[9px]"></span>`)}
            ${Array.from({ length: daysIn }, (_, i) => {
              const iso = toIso(new Date(y, m, i + 1));
              const st = dayState(byDate[iso] || [], iso);
              const rings = [];
              if (iso === TODAY) rings.push("0 0 0 1.5px var(--brass)");
              if (iso === selected && iso !== TODAY) rings.push("0 0 0 1.5px var(--text)");
              const style = { ...CELL[st], ...(rings.length ? { boxShadow: [CELL[st].boxShadow, ...rings].filter(Boolean).join(",") } : null) };
              return html`<button key=${iso} role="gridcell" aria-selected=${iso === selected}
                aria-label=${`${longDate(iso)} : ${STATE_LABEL[st]}`} title=${`${shortDate(iso)} · ${STATE_LABEL[st]}`}
                onClick=${() => setSelected(iso)} onMouseEnter=${() => setHover(iso)} onMouseLeave=${() => setHover(null)}
                class="w-[9px] h-[9px] rounded-[2px] hover:scale-150 transition-transform" style=${style}></button>`;
            })}
          </div>
        </div>`;
      })}
    </div>
    <div class="mono text-[11px] text-muted text-center truncate">
      <span class="text-dim">›</span> <span class="capitalize ${focusState === "deadline" || focusState === "late" ? "text-red" : "text-txt"}">${shortDate(focus)}</span> · ${summary}
    </div>
  </section>`;
}

function DayRail({ items, selected, onToggle, onAdd, onRemove }) {
  const list = items.filter((i) => i.date === selected).sort((a, b) => (isDeadline(b) - isDeadline(a)));
  const [title, setTitle] = useState("");
  const [type, setType] = useState("revision");
  const upcoming = items.filter((i) => isDeadline(i) && i.date >= TODAY).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 4);
  const submit = (e) => { e.preventDefault(); if (!title.trim()) return; onAdd({ title: title.trim(), type, date: selected }); setTitle(""); };
  const rel = diffDays(TODAY, selected);

  return html`<aside class="grid gap-4 md:grid-cols-2 items-start min-w-0">
    <section class="rounded-2xl border border-line bg-panel" aria-labelledby="day-h">
      <div class="px-4 py-3 border-b border-line flex items-baseline justify-between gap-2">
        <h2 id="day-h" class="text-sm font-medium capitalize">${longDate(selected)}</h2>
        <span class="mono text-xs text-dim">${rel === 0 ? "aujourd'hui" : rel > 0 ? `J+${rel}` : `J${rel}`}</span>
      </div>
      <ul class="flex flex-col">
        ${list.length === 0 && html`<li class="px-4 py-4 text-sm text-dim mono">Rien de prévu</li>`}
        ${list.map((it) => {
          const st = statusOf(it), dl = isDeadline(it);
          return html`<li key=${it.id} class="group flex items-start gap-3 px-4 py-2.5 border-b border-line last:border-b-0">
            ${dl ? html`<span class="mt-1 sq" style=${{ background: "var(--red)", width: 10, height: 10 }} aria-hidden="true"></span>`
              : html`<button onClick=${() => onToggle(it.id)} aria-label=${it.done ? "Marquer à faire" : "Marquer comme fait"}
                  class="mt-0.5 h-4 w-4 shrink-0 rounded-[3px] grid place-items-center text-[10px] text-ink"
                  style=${it.done ? { background: "var(--ok)" } : { border: `1.5px solid ${st === "late" ? "var(--red)" : "var(--muted)"}` }}>${it.done ? "✓" : ""}</button>`}
            <div class="min-w-0 flex-1">
              <div class="text-sm ${it.done ? "line-through text-dim" : dl ? "text-red font-medium" : ""}">${it.title}</div>
              <div class="mono text-[11px] text-dim">${TYPES[it.type].label.toLowerCase()} · ${it.matiere || "—"}${st === "late" ? html` · <span class="text-red">en retard</span>` : ""}</div>
            </div>
            <button onClick=${() => onRemove(it.id)} aria-label="Supprimer" class="mono text-xs text-dim hover:text-red opacity-60 group-hover:opacity-100">×</button>
          </li>`;
        })}
      </ul>
      <form onSubmit=${submit} class="flex gap-2 p-3 border-t border-line">
        <label class="sr-only" htmlFor="add-title">Nouvel élément</label>
        <input id="add-title" value=${title} onInput=${(e) => setTitle(e.target.value)} placeholder="Ajouter…"
          class="flex-1 min-w-0 bg-panel2 border border-line rounded-[10px] px-2.5 py-1.5 text-sm outline-none focus:border-line2" />
        <label class="sr-only" htmlFor="add-type">Type</label>
        <select id="add-type" value=${type} onChange=${(e) => setType(e.target.value)}
          class="bg-panel2 border border-line rounded-[10px] px-2 py-1.5 mono text-xs">
          ${Object.entries(TYPES).map(([k, v]) => html`<option key=${k} value=${k}>${v.label}</option>`)}
        </select>
      </form>
    </section>

    <section class="rounded-2xl border border-line bg-panel" aria-labelledby="up-h">
      <h2 id="up-h" class="px-4 py-3 border-b border-line eyebrow">Échéances</h2>
      <ul>
        ${upcoming.map((d) => {
          const n = diffDays(TODAY, d.date);
          return html`<li key=${d.id} class="flex items-center gap-3 px-4 py-2.5 border-b border-line last:border-b-0">
            <span class="mono text-sm font-medium w-12 shrink-0 ${n <= 7 ? "text-red" : "text-txt"}">J−${n}</span>
            <div class="min-w-0"><div class="text-sm truncate">${d.title}</div><div class="mono text-[11px] text-dim">${shortDate(d.date)}</div></div>
          </li>`;
        })}
      </ul>
    </section>
  </aside>`;
}

function Pilotage({ items, setItems, sample, setPage, mentor, streak }) {
  const [selected, setSelected] = useState(TODAY);
  const [planning, setPlanning] = useState(false);
  const [error, setError] = useState("");

  const toggle = (id) => setItems((xs) => xs.map((i) => i.id === id ? { ...i, done: !i.done, doneOn: i.done ? undefined : TODAY } : i));
  const done = (id) => setItems((xs) => xs.map((i) => i.id === id ? { ...i, done: true, doneOn: TODAY } : i));
  const remove = (id) => setItems((xs) => xs.filter((i) => i.id !== id));
  const add = (it) => setItems((xs) => [...xs, { id: uid(), done: false, matiere: "", ...it }]);

  const plan = async () => {
    setError(""); setPlanning(true);
    try {
      const deadlines = items.filter((i) => isDeadline(i) && i.date >= TODAY).map((i) => `${i.date} : ${i.title} (${i.matiere})`).join("\n");
      const existing = items.filter((i) => !isDeadline(i) && i.date >= TODAY).map((i) => `${i.date} : ${i.title}`).join("\n") || "aucune";
      const data = await askJson(sample, `${MENTOR}
Aujourd'hui : ${TODAY}. Construis des séances de révision jusqu'aux échéances ci-dessous : répétition espacée, fiches d'arrêt, cas pratiques chronométrés, un examen blanc avant chaque partiel. Au plus 2 séances par jour, 12 au total, dates entre demain et la veille de chaque échéance, sans doublon avec les séances existantes.
ÉCHÉANCES :
${deadlines}
SÉANCES EXISTANTES :
${existing}
Réponds uniquement avec un tableau JSON : [{"date":"YYYY-MM-DD","titre":"séance précise et actionnable (max 60 caractères)","matiere":"nom de la matière","type":"revision"}]`);
      if (Array.isArray(data)) {
        const added = data.map((d) => ({ id: uid(), date: d.date, title: d.titre, type: "revision", matiere: d.matiere || "Droit des contrats", done: false }));
        setItems((xs) => [...xs, ...added]);
      }
    } catch (e) {
      setError(errorText(e));
    } finally {
      setPlanning(false);
    }
  };

  return html`<div class="flex flex-col gap-6">
    <${MentorMessage} items=${items} mentor=${mentor} streak=${streak} onDone=${done} onPlan=${plan} onGo=${() => setPage("cours")} planning=${planning} />
    ${error && html`<div class="rounded-xl p-4 border border-red/30 bg-red-soft text-red text-sm">${error}</div>`}
    <${Tracker} items=${items} selected=${selected} setSelected=${setSelected} />
    <${DayRail} items=${items} selected=${selected} onToggle=${toggle} onAdd=${add} onRemove=${remove} />
  </div>`;
}

function CelluleEntrainement({ sample }) {
  const [epreuve, setEpreuve] = useState("dissertation");
  const [dureeMin, setDureeMin] = useState(180);
  const [sujetType, setSujetType] = useState("contrats");
  const [sujetCustom, setSujetCustom] = useState("");
  const [locked, setLocked] = useState(true);

  const [active, setActive] = useState(false);
  const [timeLeft, setTimeLeft] = useState(180 * 60);
  const [copyText, setCopyText] = useState("");
  const [exits, setExits] = useState(0);
  const [submitting, setSubmitting] = useState(false);
  const [result, setResult] = useState(null);

  const SUJETS = {
    contrats: "La force obligatoire du contrat.",
    administratif: "Le juge administratif et la loi.",
    constitutionnel: "Le Conseil constitutionnel, juge des droits et libertés.",
  };

  useEffect(() => {
    if (!active) return;
    const t = setInterval(() => {
      setTimeLeft((s) => {
        if (s <= 1) { clearInterval(t); return 0; }
        return s - 1;
      });
    }, 1000);
    return () => clearInterval(t);

async function askJson(sample, prompt, signal) {
  let code = store.get("mj_code", "");
  if (!code) {
    code = (window.prompt("Code d'accès Mentor Juris :") || "").trim();
    if (!code) throw { code: "bad_code" };
    store.set("mj_code", code);
  }
  let r;
  try {
    r = await fetch("/api/corriger", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt, code }),
      signal
    });
  } catch { throw { code: "network" }; }
  if (r.status === 401) { store.set("mj_code", ""); throw { code: "bad_code" }; }
  if (r.status === 400) throw { code: "prompt_too_large" };
  if (r.status === 429) throw { code: "rate_limited" };
  if (!r.ok) throw { code: "failed" };
  const { text } = await r.json();
  const s = (text || "").trim().replace(/^\x60{3}(?:json)?\s*/i, "").replace(/\s*\x60{3}$/, "");
  try { return JSON.parse(s); } catch {}
  const a = s.search(/[\[{]/), b = Math.max(s.lastIndexOf("}"), s.lastIndexOf("]"));
  if (a >= 0 && b > a) { try { return JSON.parse(s.slice(a, b + 1)); } catch {} }
  throw { code: "invalid_json" };
}

function chunkText(t, size = 12000) {
  const out = [];
  let i = 0;
  while (i < t.length) {
    let end = Math.min(i + size, t.length);
    if (end < t.length) { const cut = t.lastIndexOf("\n", end); if (cut > i + size * 0.6) end = cut; }
    out.push(t.slice(i, end));
    i = end;
  }
  return out;
}
async function analyzeCours(matiere, notes, onProgress) {
  const chunks = chunkText(notes.slice(0, COURS_CAP));
  const acc = { plan: [], notions: [], arrets: [] };
  for (let i = 0; i < chunks.length; i++) {
    if (onProgress) onProgress(i + 1, chunks.length);
    const data = await askJson(null, `Voici ${chunks.length > 1 ? `la partie ${i + 1} sur ${chunks.length} des` : "les"} notes de cours d'un étudiant en droit, matière : ${matiere}. Extrais-en uniquement ce qui y figure, sans rien ajouter de ton cru.
Réponds uniquement en JSON valide :
{"plan":["intitulé de chapitre ou de partie (8 au maximum)"],"notions":["notion clé (8 au maximum)"],"arrets":["arrêt ou texte cité, avec sa date (8 au maximum)"]}
NOTES :
${chunks[i]}`);
    for (const k of ["plan", "notions", "arrets"]) {
      for (const v of (Array.isArray(data[k]) ? data[k] : [])) {
        const s = clean(v, 120);
        if (s && !acc[k].some((x) => x.toLowerCase() === s.toLowerCase())) acc[k].push(s);
      }
    }
  }
  for (const k of Object.keys(acc)) acc[k] = acc[k].slice(0, 14);
  return acc;
}
function coursContext() {
  const parts = [];
  for (const [m, v] of Object.entries(getCours())) {
    const d = v && v.digest;

    const L = (a) => (a || []).slice(0, 10).join(" ; ");
    parts.push(`${m} — plan : ${L(d.plan)}. Notions : ${L(d.notions)}. Arrêts : ${L(d.arrets)}.`);

  const s = parts.join(" | ").slice(0, 5000);
  return s ? ` Éléments extraits des cours de l'étudiant (à utiliser quand c'est pertinent, sans en déduire autre chose) : ${s}` : "";
}

  }

  async function next() {
    setErr("");
    if (step === 0) {
      if (!code.trim()) return setErr("Entre le code d'accès qu'on t'a donné.");
      if (!clean(prenom, 30)) return setErr("Dis-moi comment je dois t'appeler.");
      if (email.trim()) {
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim())) return setErr("Cette adresse e-mail n'a pas l'air valide.");
        if (!consent) return setErr("Coche la case pour recevoir des nouvelles, ou laisse l'e-mail vide.");
      }
      setBusy(true);
      const res = await checkCode();
      setBusy(false);
      if (res === "bad") return setErr("Code d'accès invalide.");
      if (res === "network") return setErr("Connexion impossible. Vérifie ton réseau et réessaie.");
      if (res !== "ok") return setErr("Impossible de vérifier le code pour le moment. Réessaie dans un instant.");
      store.set("mj_code", code.trim());
      return setStep(1);
    }
    if (step === 1) {
      if (!niveau) return setErr("Choisis ton niveau.");
      if (!matieres.length) return setErr("Choisis au moins une matière.");
      syncRows();
      return setStep(2);
    }
    if (step === 2) {
      if (rows.some((r) => r.date && r.date < TODAY)) return setErr("Une des dates est déjà passée. Corrige-la ou laisse-la vide.");
      return setStep(3);
    }
    if (step === 3) return setStep(4);
    return finish();
  }

  function finish() {
    const dated = rows.filter((r) => r.date);
    const items = dated.map((r) => ({ id: uid(), date: r.date, title: (r.type === "partiel" ? "Partiel — " : "Rendu — ") + r.matiere, type: r.type, matiere: r.matiere, done: false }));
    const nextOne = [...dated].sort((a, b) => a.date.localeCompare(b.date))[0];
    const first = nextOne ? nextOne.matiere : matieres[0];
    const withNotes = matieres.filter((m) => (notes[m] || "").trim());
    const target = withNotes.length ? (withNotes.includes(first) ? first : withNotes[0]) : first;
    const title = withNotes.length ? "Fais analyser tes notes de " + target : "Colle tes notes de " + target + " dans l'onglet Mes cours";
    items.push({ id: uid(), date: TODAY, title, type: "tache", matiere: target, done: false, go: "cours" });
    const profile = { prenom: clean(prenom, 30), niveau, matieres, objectif, rythme, mentor, createdAt: TODAY };
    if (email.trim() && consent) {
      const fd = new FormData();
      fd.append("email", email.trim()); fd.append("niveau", niveau); fd.append("source", "app"); fd.append("consentement", "oui");
      fetch(MJ_FORM, { method: "POST", headers: { Accept: "application/json" }, body: fd }).catch(() => {});
    }
    const cours = getCours();
    for (const m of matieres) if ((notes[m] || "").trim()) cours[m] = { ...(cours[m] || {}), notes: notes[m], digest: undefined };
    saveCours(cours);
    store.set("mj_items", items);
    store.set("mj_mentor", mentor);
    store.set("mj_profile", profile);
    onDone(profile);
  }

  const titles = ["Bienvenue", "Ton cursus", "Tes échéances", "Tes cours", "Ton mentor"];
  const subs = [
    "Quelques questions, trois minutes. Ensuite, le mentor te dit quoi faire dès aujourd'hui.",
    "Pour adapter l'exigence et les exercices à ton niveau.",
    "Sans dates, le mentor ne peut pas te donner d'ordre du jour. Tu peux en ajouter d'autres plus tard.",
    "Colle ton plan de cours ou tes notes, matière par matière. Plus le mentor en sait, plus ses séances sont précises. Tu peux passer cette étape.",
    "Le ton change, pas l'exigence. Tu pourras en changer à tout moment."
  ];

  return html`<div class="min-h-screen flex flex-col items-center px-4 py-8 sm:py-12">
    <div class="w-full max-w-xl flex flex-col gap-5">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <span class="w-7 h-7 rounded-lg grid place-items-center text-xs font-medium text-ink" style=${{ background: "var(--brass)" }}>⚖</span>
          <span class="display font-medium tracking-tight">Mentor Juris</span>
        </div>
        <span class="mono text-xs text-dim">Étape ${step + 1} sur 5</span>
      </div>
      <div class="flex gap-1.5" aria-hidden="true">
        ${[0, 1, 2, 3, 4].map((i) => html`<span key=${i} class="h-1 flex-1 rounded-full" style=${{ background: i <= step ? "var(--brass)" : "var(--panel-2)" }}></span>`)}
      </div>

      <div class="rounded-2xl border border-line bg-panel p-5 sm:p-6 flex flex-col gap-5">
        <div class="flex flex-col gap-1">
          <h1 class="display text-2xl leading-tight">${titles[step]}</h1>
          <p class="text-muted text-sm">${subs[step]}</p>
        </div>

        ${step === 0 && html`<div class="flex flex-col gap-4">
          <div class="flex flex-col gap-1.5">
            <label class="eyebrow" htmlFor="ob-code">Code d'accès de la bêta</label>
            <input id="ob-code" type="password" autoComplete="off" value=${code} onInput=${(e) => setCode(e.target.value)} class=${OINPUT} placeholder="Le code qu'on t'a donné" />
          </div>
          <div class="flex flex-col gap-1.5">
            <label class="eyebrow" htmlFor="ob-prenom">Ton prénom</label>
            <input id="ob-prenom" type="text" autoComplete="given-name" value=${prenom} onInput=${(e) => setPrenom(e.target.value)} class=${OINPUT} placeholder="Comment le mentor doit t'appeler" />
          </div>
          <div class="flex flex-col gap-1.5">
            <label class="eyebrow" htmlFor="ob-email">E-mail (facultatif)</label>
            <input id="ob-email" type="email" autoComplete="email" value=${email} onInput=${(e) => setEmail(e.target.value)} class=${OINPUT} placeholder="Pour être prévenu des nouveautés" />
            ${email.trim() && html`<label class="flex gap-2.5 items-start text-xs text-muted">
              <input type="checkbox" checked=${consent} onChange=${(e) => setConsent(e.target.checked)} class="mt-0.5" style=${{ accentColor: "var(--brass)" }} />
              <span>J'accepte de recevoir des e-mails sur Mentor Juris. Je peux me désinscrire à tout moment.</span></label>`}
          </div>
          <p class="text-xs text-dim">Les textes que tu soumets sont traités par une IA (Anthropic). L'IA peut se tromper : vérifie toujours les références. <a href="/landing.html#confidentialite" target="_blank" rel="noopener" class="underline" style=${{ color: "var(--brass)" }}>Confidentialité</a></p>
        </div>`}

        ${step === 1 && html`<div class="flex flex-col gap-5">
          <div class="flex flex-col gap-2">
            <span class="eyebrow">Ton niveau</span>
            <div class="flex flex-wrap gap-2">${NIVEAUX.map((n) => html`<${OChip} key=${n} on=${niveau === n} onClick=${() => setNiveau(n)}>${n}<//>`)}</div>
          </div>
          <div class="flex flex-col gap-2">
            <span class="eyebrow">Tes matières ce semestre</span>
            <div class="flex flex-wrap gap-2">
              ${(SUGGESTIONS[niveau] || []).map((m) => html`<${OChip} key=${m} on=${matieres.includes(m)} onClick=${() => toggleMatiere(m)}>${m}<//>`)}
              ${matieres.filter((m) => !(SUGGESTIONS[niveau] || []).includes(m)).map((m) => html`<${OChip} key=${m} on=${true} onClick=${() => toggleMatiere(m)}>${m} ✕<//>`)}
            </div>
            ${!niveau && html`<p class="text-xs text-dim">Choisis d'abord ton niveau pour voir des suggestions.</p>`}
            <div class="flex gap-2">
              <input type="text" value=${custom} onInput=${(e) => setCustom(e.target.value)} onKeyDown=${(e) => { if (e.key === "Enter") { e.preventDefault(); addCustom(); } }}
                class=${OINPUT} placeholder="Ajouter une autre matière" aria-label="Ajouter une autre matière" />
              <button type="button" onClick=${addCustom} class="mono text-xs px-4 rounded-xl border border-line text-muted hover:text-txt shrink-0">Ajouter</button>
            </div>
          </div>
        </div>`}

        ${step === 2 && html`<div class="flex flex-col gap-3">
          ${rows.map((r) => html`<div key=${r.id} class="grid gap-2 rounded-xl border border-line p-3" style=${{ background: "var(--panel-2)" }}>
            <div class="flex gap-2 items-center">
              <select value=${r.matiere} onChange=${(e) => setRow(r.id, { matiere: e.target.value })} aria-label="Matière" class="flex-1 min-w-0 bg-panel border border-line rounded-lg px-2.5 py-2 text-sm outline-none">
                ${matieres.map((m) => html`<option key=${m} value=${m}>${m}</option>`)}
              </select>
              <button type="button" onClick=${() => setRows((rs) => rs.filter((x) => x.id !== r.id))} aria-label="Supprimer cette échéance" class="mono text-xs text-dim hover:text-red px-2 py-2">✕</button>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <select value=${r.type} onChange=${(e) => setRow(r.id, { type: e.target.value })} aria-label="Type d'échéance" class="min-w-0 bg-panel border border-line rounded-lg px-2.5 py-2 text-sm outline-none">
                <option value="partiel">Partiel / examen</option>
                <option value="td">Rendu de TD / galop</option>
              </select>
              <input type="date" value=${r.date} min=${TODAY} onInput=${(e) => setRow(r.id, { date: e.target.value })} aria-label="Date" class="min-w-0 bg-panel border border-line rounded-lg px-2.5 py-2 text-sm outline-none" />
            </div>
          </div>`)}
          <button type="button" onClick=${() => setRows((rs) => [...rs, { id: uid(), matiere: matieres[0], type: "partiel", date: "" }])}
            class="mono text-xs py-2 px-4 rounded-lg border border-line text-muted hover:text-txt w-fit">+ Ajouter une échéance</button>
          <p class="text-xs text-dim">Laisse la date vide si tu ne la connais pas encore.</p>
        </div>`}

        ${step === 3 && html`<div class="flex flex-col gap-4">
          ${matieres.map((m) => html`<div key=${m} class="flex flex-col gap-1.5">
            <label class="eyebrow" htmlFor=${"ob-n-" + m}>${m}</label>
            <textarea id=${"ob-n-" + m} rows="4" value=${notes[m] || ""} onInput=${(e) => setNotes((n) => ({ ...n, [m]: e.target.value.slice(0, COURS_CAP) }))}
              placeholder="Colle ici ton plan de cours ou tes notes (facultatif)" class=${OINPUT + " font-mono resize-y leading-relaxed"}></textarea>
            ${(notes[m] || "").length > 0 && html`<span class="mono text-[11px] text-dim">${(notes[m] || "").length} caractères</span>`}
          </div>`)}
          <p class="text-xs text-dim">Tu pourras en ajouter à tout moment dans l'onglet « Mes cours », où le mentor les analyse.</p>
        </div>`}

        ${step === 4 && html`<div class="flex flex-col gap-5">
          <div class="grid gap-2.5">
            ${Object.entries(MENTORS).map(([k, m]) => html`<button key=${k} type="button" disabled=${m.pro} onClick=${() => setMentor(k)} aria-pressed=${mentor === k}
              class="text-left rounded-xl border p-3.5 flex gap-3 items-start disabled:opacity-50"
              style=${mentor === k ? { borderColor: "var(--brass)", background: "var(--brass-soft)" } : { borderColor: "var(--line)" }}>
              <${Avatar} mentor=${m} size=${34} />
              <span class="flex flex-col gap-0.5 min-w-0">
                <span class="text-sm font-medium">${m.name} ${m.pro ? html`<span class="mono text-[10px] text-dim ml-1">Pro · bientôt</span>` : ""}</span>
                <span class="text-xs text-muted">${m.tag}</span>
                <span class="text-xs text-muted">${m.desc}</span>
                <span class="text-xs text-dim italic mt-1">${m.quote}</span>
              </span></button>`)}
          </div>
          <div class="flex flex-col gap-2">
            <span class="eyebrow">Ton objectif</span>
            <div class="flex flex-wrap gap-2">${OBJECTIFS.map((o) => html`<${OChip} key=${o} on=${objectif === o} onClick=${() => setObjectif(o)}>${o}<//>`)}</div>
          </div>
          <div class="flex flex-col gap-2">
            <span class="eyebrow">Ton temps de révision</span>
            <div class="flex flex-wrap gap-2">${RYTHMES.map((o) => html`<${OChip} key=${o} on=${rythme === o} onClick=${() => setRythme(o)}>${o}<//>`)}</div>
          </div>
        </div>`}

        ${err && html`<div role="alert" class="rounded-xl p-3 border text-xs" style=${{ borderColor: "rgba(255,59,78,.3)", background: "var(--red-soft)", color: "var(--red)" }}>${err}</div>`}

        <div class="flex items-center justify-between pt-1">
          ${step > 0 ? html`<button type="button" onClick=${() => { setErr(""); setStep(step - 1); }} class="mono text-xs text-muted hover:text-txt px-2 py-2">← Retour</button>` : html`<span></span>`}
          <button type="button" onClick=${next} disabled=${busy}
            class="mono text-xs px-5 py-2.5 rounded-xl text-ink font-medium hover:brightness-110 disabled:opacity-60 inline-flex items-center gap-2" style=${{ background: "var(--brass)" }}>
            ${busy && html`<${Spinner} />`} ${step === 4 ? "Commencer" : "Continuer"}</button>
        </div>
      </div>
    </div>
  </div>`;
}

function MesCours({ setItems }) {
  const prof = store.get("mj_profile", null) || { matieres: [] };
  const [cours, setCours] = useState(() => getCours());
  const [busy, setBusy] = useState("");
  const [prog, setProg] = useState("");
  const [msg, setMsg] = useState("");
  const [extra, setExtra] = useState("");
  const matieres = [...new Set([...(prof.matieres || []), ...Object.keys(cours)])];

  const update = (m, patch) => {
    const latest = getCours();
    const next = { ...latest, [m]: { notes: "", ...(latest[m] || {}), ...patch } };
    if (!saveCours(next)) { setMsg("Le stockage du navigateur est plein. Raccourcis tes notes."); return false; }
    setMsg("");
    setCours(next);
    refreshContext();
    return true;
  };
  const setNotesFor = (m, text) => {
    const tooLong = text.length > COURS_CAP;
    if (update(m, { notes: text.slice(0, COURS_CAP) }) && tooLong) setMsg(`Notes tronquées à ${COURS_CAP.toLocaleString("fr-FR")} caractères.`);
  };
  const importFile = (m, file) => {
    if (!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      const cur = (getCours()[m] || {}).notes || "";
      setNotesFor(m, (cur ? cur + "\n\n" : "") + String(rd.result || ""));
    };
    rd.readAsText(file);
  };
  const analyze = async (m) => {
    const c = getCours()[m];
    if (!c || !c.notes.trim()) return;
    setBusy(m); setMsg("");
    try {
      const digest = await analyzeCours(m, c.notes, (i, n) => setProg(n > 1 ? `${i}/${n}` : ""));
      update(m, { digest, analyzedLen: c.notes.length });
      if (setItems) setItems((xs) => xs.map((i) => i.go === "cours" && i.matiere === m && !i.done ? { ...i, done: true, doneOn: TODAY } : i));
    } catch (e) {
      setMsg(errorText(e));
    } finally { setBusy(""); setProg(""); }
  };
  const clear = (m) => { if (confirm("Vider les notes et l'analyse de « " + m + " » ?")) update(m, { notes: "", digest: undefined, analyzedLen: undefined }); };
  const addMatiere = () => {
    const m = clean(extra, 50);
    if (m && !matieres.includes(m)) update(m, { notes: "" });
    setExtra("");
  };

  return html`<div class="flex flex-col gap-4 max-w-3xl">
    <${PageHead} title="Mes cours" sub="Colle tes notes matière par matière. Le mentor les analyse pour te proposer des séances précises plutôt que génériques. Tes notes restent dans ton navigateur et ne sont envoyées à l'IA que pendant l'analyse et les générations." />
    ${msg && html`<div role="alert" class="rounded-xl p-3 border text-xs" style=${{ borderColor: "rgba(255,59,78,.3)", background: "var(--red-soft)", color: "var(--red)" }}>${msg}</div>`}
    ${matieres.length === 0 && html`<p class="text-sm text-muted">Aucune matière pour l'instant. Ajoute-en une ci-dessous.</p>`}
    ${matieres.map((m) => {
      const c = cours[m] || { notes: "" };
      const n = (c.notes || "").length;
      const d = c.digest;
      const stale = d && c.analyzedLen !== n;
      return html`<section key=${m} class="rounded-2xl border border-line bg-panel p-4 flex flex-col gap-3">
        <div class="flex items-baseline justify-between gap-3">
          <h2 class="text-sm font-medium">${m}</h2>
          <span class="mono text-xs ${d && !stale ? "text-ok" : "text-dim"}">${n === 0 ? "Aucune note" : d ? (stale ? "Notes modifiées" : "Analysé") : `${n.toLocaleString("fr-FR")} caractères`}</span>
        </div>
        <textarea rows=${n ? 6 : 3} value=${c.notes || ""} onInput=${(e) => setNotesFor(m, e.target.value)}
          placeholder="Colle ici ton plan de cours, tes notes de CM, tes fiches…" aria-label=${"Notes de " + m}
          class=${OINPUT + " font-mono resize-y leading-relaxed"}></textarea>
        <div class="flex flex-wrap items-center gap-2">
          <button type="button" onClick=${() => analyze(m)} disabled=${!!busy || !n}
            class="mono text-xs px-4 py-2 rounded-[10px] text-ink font-medium hover:brightness-110 disabled:opacity-50 inline-flex items-center gap-2" style=${{ background: "var(--brass)" }}>
            ${busy === m && html`<${Spinner} />`} ${d ? "Réanalyser" : "Analyser mes notes"}${busy === m && prog ? ` (${prog})` : ""}</button>
          <label class="mono text-xs px-3 py-2 rounded-[10px] border border-line text-muted hover:text-txt cursor-pointer">Importer un .txt
            <input type="file" accept=".txt,.md,text/plain" class="hidden" onChange=${(e) => { importFile(m, e.target.files[0]); e.target.value = ""; }} /></label>
          ${n > 0 && html`<button type="button" onClick=${() => clear(m)} class="mono text-xs px-3 py-2 text-dim hover:text-red">Vider</button>`}
        </div>
        ${stale && html`<p class="text-xs text-dim">Tes notes ont changé depuis la dernière analyse.</p>`}
        ${d && html`<div class="rounded-xl border border-line p-3 text-xs flex flex-col gap-1.5" style=${{ background: "var(--panel-2)" }}>
          <div class="eyebrow">Ce que le mentor a retenu · vérifie que c'est exact</div>
          ${[["Plan", "plan"], ["Notions", "notions"], ["Arrêts", "arrets"]].map(([l, k]) => (d[k] || []).length ? html`<div key=${k}><span class="text-muted">${l} : </span>${d[k].join(" · ")}</div>` : null)}
        </div>`}
      </section>`;
    })}
    <div class="flex gap-2 max-w-md">
      <input type="text" value=${extra} onInput=${(e) => setExtra(e.target.value)} onKeyDown=${(e) => { if (e.key === "Enter") { e.preventDefault(); addMatiere(); } }}
        class=${OINPUT} placeholder="Ajouter une matière" aria-label="Ajouter une matière" />
      <button type="button" onClick=${addMatiere} class="mono text-xs px-4 rounded-xl border border-line text-muted hover:text-txt shrink-0">Ajouter</button>
    </div>
  </div>`;
}

function Root() {
  const [profile, setProfile] = useState(() => store.get("mj_profile", null));
  if (!profile || !Array.isArray(profile.matieres)) return html`<${Onboarding} onDone=${setProfile} />`;
  applyProfileContext(profile);
  const reset = () => {
    if (!confirm("Refaire la configuration ? Ton calendrier actuel sera remplacé. Tes notes de cours sont conservées.")) return;
    store.set("mj_profile", null);
    store.set("mj_items", []);
    setProfile(null);
  };
  return html`<${React.Fragment}>
    <${App} />
    <button onClick=${reset} class="fixed bottom-3 right-3 z-40 mono text-[11px] px-2.5 py-1.5 rounded-lg border border-line text-dim hover:text-muted" style=${{ background: "var(--ink)" }}>Refaire la configuration</button>
  <//>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${Root} />`);
</script>
</body>
</html>
