const DAY = 86400000;
const pad = (n) => String(n).padStart(2, "0");
const toIso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromIso = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const isoIn = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return toIso(d); };
const TODAY = isoIn(0);
const diffDays = (a, b) => Math.round((fromIso(b) - fromIso(a)) / DAY);
const longDate = (s) => fromIso(s).toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
const shortDate = (s) => fromIso(s).toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" });

const auth = {
  _refreshing: null,

  save(d) {
    const s = { access_token: d.access_token, refresh_token: d.refresh_token,

  async call(path, opts = {}) {
    let r;
    try { r = await fetch(SB_URL + path, { ...opts, headers: { apikey: SB_KEY, "Content-Type": "application/json", ...(opts.headers || {}) } }); }
    catch { throw { code: "network" }; }
    return r;
  },
  async signIn(email, password) {
    const r = await auth.call("/auth/v1/token?grant_type=password", { method: "POST", body: JSON.stringify({ email: email.trim().toLowerCase(), password }) });
    if (r.status === 429) throw { code: "rate_limited" };
    if (!r.ok) throw { code: r.status === 400 ? "bad_login" : "failed" };
    return auth.save(await r.json());
  },
  async signUp(email, password, code) {
    let r;
    try { r = await fetch("/api/signup", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email, password, code }) }); }

  async recover(email) {
    const to = encodeURIComponent(location.origin + location.pathname);
    const r = await auth.call("/auth/v1/recover?redirect_to=" + to, { method: "POST", body: JSON.stringify({ email: email.trim().toLowerCase() }) });
    if (r.status === 429) throw { code: "rate_limited" };
    if (!r.ok) throw { code: "failed" };
  },
  async token() {
    const s = auth.session();
    if (!s) throw { code: "auth" };
    if (s.expires_at * 1000 - Date.now() > 60000) return s.access_token;
    if (!auth._refreshing) auth._refreshing = (async () => {
      const r = await auth.call("/auth/v1/token?grant_type=refresh_token", { method: "POST", body: JSON.stringify({ refresh_token: s.refresh_token }) });
      if (r.status === 400 || r.status === 401) { auth.clear(); throw { code: "auth" }; }
      if (!r.ok) throw { code: "failed" };
      return auth.save(await r.json()).access_token;
    })().finally(() => { auth._refreshing = null; });
    return auth._refreshing;
  },
  async setPassword(password, accessToken) {
    const r = await auth.call("/auth/v1/user", { method: "PUT", headers: { Authorization: "Bearer " + (accessToken || await auth.token()) }, body: JSON.stringify({ password }) });
    if (r.status === 422) throw { code: "same_password" };
    if (!r.ok) throw { code: r.status === 401 ? "auth" : "failed" };

function wipeLocal() {

const v_null = (raw) => raw === null || raw === undefined || raw === "null";
const sync = {
  ready: false, dirty: new Set(), timer: null, status: "ok", listeners: new Set(), last: {},
  setStatus(s) { this.status = s; this.listeners.forEach((f) => f(s)); },
  mark(k) {
    if (!this.ready || !SYNC_KEYS.includes(k)) return;
    let raw = null;
    try { raw = localStorage.getItem(k); } catch {}
    if (!this.dirty.has(k) && (v_null(raw) ? null : raw) === this.last[k]) return; // rien de neuf depuis la dernière synchro
    this.dirty.add(k);
    this.setStatus("pending");
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flush().catch(() => {}), 1500);
  },
  async rest(path, opts = {}, keepalive) {
    const t = await auth.token();
    let r;
    try { r = await fetch(SB_URL + "/rest/v1/" + path, { ...opts, keepalive: !!keepalive, headers: { apikey: SB_KEY, Authorization: "Bearer " + t, "Content-Type": "application/json", ...(opts.headers || {}) } }); }
    catch { throw { code: "network" }; }
    if (r.status === 401) throw { code: "auth" };
    if (!r.ok) throw { code: "failed" };
    return r;
  },
  async push(keys, keepalive) {
    const uidUser = (auth.session() || {}).user?.id;
    if (!uidUser || !keys.length) return;
    const now = new Date().toISOString(), up = [], del = [], raws = {};
    for (const k of keys) {
      let v = null;
      try { raws[k] = localStorage.getItem(k); v = JSON.parse(raws[k] || "null"); } catch {}
      if (v === null || v === undefined) del.push(k); else up.push({ user_id: uidUser, k, v, updated_at: now });
    }
    const done = () => { for (const k of keys) this.last[k] = v_null(raws[k]) ? null : raws[k]; };
    if (up.length) await this.rest("user_kv?on_conflict=user_id,k", { method: "POST", headers: { Prefer: "resolution=merge-duplicates,return=minimal" }, body: JSON.stringify(up) }, keepalive);
    if (del.length) await this.rest("user_kv?k=in.(" + del.join(",") + ")", { method: "DELETE", headers: { Prefer: "return=minimal" } }, keepalive);
    done();
  },
  async flush(keepalive) {
    clearTimeout(this.timer);
    if (!this.ready || !this.dirty.size) return;
    const keys = [...this.dirty];
    this.dirty.clear();
    this.setStatus("saving");
    try { await this.push(keys, keepalive); this.setStatus(this.dirty.size ? "pending" : "ok"); }
    catch (e) {
      keys.forEach((k) => this.dirty.add(k));
      this.setStatus(e.code === "auth" ? "auth" : "offline");
      if (e.code !== "auth") this.timer = setTimeout(() => this.flush().catch(() => {}), 15000);
      throw e;
    }
  },
  // Connexion → récupération → affichage. Compte vide : on envoie les données locales.
  async pull() {
    const r = await this.rest("user_kv?select=k,v");
    const rows = await r.json();
    if (!rows.length) {
      const local = SYNC_KEYS.filter((k) => { try { return JSON.parse(localStorage.getItem(k) || "null") !== null; } catch { return false; } });
      await this.push(local);
    } else {
      const remote = Object.fromEntries(rows.map((x) => [x.k, x.v]));
      for (const k of SYNC_KEYS) {
        try { if (k in remote) localStorage.setItem(k, (this.last[k] = JSON.stringify(remote[k]))); else { localStorage.removeItem(k); this.last[k] = null; } } catch {}
      }
    }
    this.ready = true;
    this.setStatus("ok");
  }
};

const plural = (n, w) => `${n} ${w}${n > 1 ? "s" : ""}`;
function mentorOrder(items, tone = "strict") {
  const pending = items.filter((i) => !i.done && !isDeadline(i));
  const overdue = pending.filter((i) => i.date < TODAY).sort((a, b) => a.date.localeCompare(b.date));
  const deadlines = items.filter((i) => isDeadline(i) && i.date >= TODAY).sort((a, b) => a.date.localeCompare(b.date));
  const next = deadlines[0];
  const todayTasks = pending.filter((i) => i.date === TODAY);
  const nextIn = next ? diffDays(TODAY, next.date) : null;
  const strict = tone === "strict";

  if (overdue.length) {
    const o = overdue[0], late = diffDays(o.date, TODAY);
    return { task: o,
      order: strict ? `Terminez « ${o.title} » avant toute autre chose.` : `Commencez par « ${o.title} », qui est en retard.`,
      why: strict
        ? `En retard depuis ${plural(late, "jour")}.${next ? ` ${next.title} dans ${nextIn} jours : chaque retard se paie le jour J.` : ""}`
        : `Prévue il y a ${plural(late, "jour")}. La rattraper maintenant allège le reste de la semaine.` };
  }
  if (todayTasks.length) {
    const t = todayTasks.find((i) => next && i.matiere === next.matiere) || todayTasks[0];
    const rest = todayTasks.length - 1;
    return { task: t,
      order: strict ? `Aujourd'hui : « ${t.title} ». Rien d'autre tant que ce n'est pas fait.` : `Priorité du jour : « ${t.title} ».`,
      why: [next && `${next.title} dans ${plural(nextIn, "jour")}.`, rest > 0 && `Puis ${plural(rest, "autre tâche")} aujourd'hui.`].filter(Boolean).join(" ") };
  }
  if (next && nextIn <= 14) {
    return { plan: true,
      order: strict ? `Rien n'est prévu aujourd'hui et « ${next.title} » tombe dans ${nextIn} jours. Planifiez vos séances maintenant.`
                    : `« ${next.title} » arrive dans ${nextIn} jours et rien n'est prévu aujourd'hui. Planifions quelques séances.`,
      why: strict ? "Un jour sans plan est un jour perdu." : "Quelques séances courtes suffisent pour démarrer." };
  }
  return {
    order: strict ? "Calendrier dégagé. Avancez une fiche d'arrêt aujourd'hui, même courte." : "Rien d'urgent aujourd'hui. Une fiche d'arrêt courte serait un bon usage de votre temps.",
    why: next ? `Prochaine échéance : ${next.title}, dans ${nextIn} jours.` : "" };
}

function streakOf(items) {
  const days = new Set(items.filter((i) => i.done && !isDeadline(i)).map((i) => i.doneOn || i.date));
  const validatedToday = days.has(TODAY);
  let n = 0, d = validatedToday ? 0 : -1;
  while (days.has(isoIn(d))) { n++; d--; }
  const week = Array.from({ length: 7 }, (_, i) => days.has(isoIn(i - 6)));
  return { n, validatedToday, week };
}

function CopyButton({ text, targetRef }) {
  const [state, setState] = useState("idle");
  const onClick = async () => {
    try { await navigator.clipboard.writeText(text); setState("done"); }
    catch {
      const el = targetRef.current;
      if (el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
      setState("select");
    }
    setTimeout(() => setState("idle"), 2200);
  };
  return html`<button onClick=${onClick} disabled=${!text}
    class="mono text-xs px-2.5 py-1.5 rounded-[10px] border border-line hover:border-line2 hover:text-txt text-muted disabled:opacity-40">

function statusOf(it) {
  if (it.done) return "done";
  return it.date < TODAY ? "late" : "todo";
}

function dayState(list, iso) {
  if (list.some(isDeadline)) return "deadline";
  const tasks = list.filter((i) => !isDeadline(i));
  if (tasks.some((t) => statusOf(t) === "late")) return "late";
  if (tasks.length && tasks.every((t) => t.done)) return "done";
  if (tasks.some((t) => t.done)) return "partial";
  if (tasks.length && iso >= TODAY) return "todo";
  return iso < TODAY ? "past" : "empty";
}
const CELL = {
  deadline: { background: "var(--red)" },
  late:     { background: "var(--red)" },
  done:     { background: "var(--ok)" },
  partial:  { background: "var(--ok)", opacity: .45 },
  todo:     { background: "transparent", boxShadow: "inset 0 0 0 1px var(--muted)" },
  empty:    { background: "var(--panel-2)" },
  past:     { background: "var(--line)" },
};
const STATE_LABEL = { deadline: "échéance", late: "en retard", done: "validé", partial: "en cours", todo: "à faire", empty: "libre", past: "passé" };

function Tracker({ items, selected, setSelected }) {
  const byDate = useMemo(() => {
    const m = {};
    for (const it of items) (m[it.date] ||= []).push(it);
    return m;
  }, [items]);
  const [hover, setHover] = useState(null);
  const now = fromIso(TODAY);
  const startY = now.getMonth() >= 8 ? now.getFullYear() : now.getFullYear() - 1;
  const months = Array.from({ length: 12 }, (_, i) => new Date(startY, 8 + i, 1));
  const focus = hover || selected;
  const focusList = byDate[focus] || [];
  const focusState = dayState(focusList, focus);
  const summary = focusList.length
    ? [focusList.find(isDeadline)?.title, `${focusList.filter((i) => !isDeadline(i)).length} tâche(s)`].filter(Boolean).join(" · ")
    : "rien de prévu";

  return html`<section aria-labelledby="trk-h" class="rounded-2xl border border-line bg-panel px-5 sm:px-7 py-4 flex flex-col gap-3.5">
    <div class="flex flex-wrap items-baseline justify-between gap-x-4 gap-y-2">
      <h2 id="trk-h" class="eyebrow">Année ${startY}–${startY + 1}</h2>
      <div class="flex flex-wrap gap-x-3 gap-y-1 mono text-[10.5px] text-muted">
        ${[["deadline", "échéance / retard"], ["done", "validé"], ["todo", "à faire"], ["empty", "libre"]].map(([k, l]) => html`<span key=${k} class="inline-flex items-center gap-1.5">
          <span class="sq" style=${CELL[k]}></span>${l}</span>`)}
      </div>
    </div>
    <div class="flex flex-wrap justify-center gap-x-5 gap-y-3" role="grid" aria-label="Tracker annuel">
      ${months.map((first) => {
        const y = first.getFullYear(), m = first.getMonth();
        const offset = (first.getDay() + 6) % 7;
        const daysIn = new Date(y, m + 1, 0).getDate();
        const isCurrent = y === now.getFullYear() && m === now.getMonth();
        return html`<div key=${m} class="flex flex-col gap-1.5" role="row">
          <span class="mono text-[10.5px] leading-none tracking-wide ${isCurrent ? "text-brass font-medium" : "text-muted"}">${first.toLocaleDateString("fr-FR", { month: "short" }).replace(".", "")}</span>
          <div class="grid grid-cols-7 gap-[2px]">
            ${Array.from({ length: offset }, (_, i) => html`<span key=${"o" + i} class="w-[9px] h-[9px]"></span>`)}
            ${Array.from({ length: daysIn }, (_, i) => {
              const iso = toIso(new Date(y, m, i + 1));
              const st = dayState(byDate[iso] || [], iso);
              const rings = [];
              if (iso === TODAY) rings.push("0 0 0 1.5px var(--brass)");
              if (iso === selected && iso !== TODAY) rings.push("0 0 0 1.5px var(--text)");
              const style = { ...CELL[st], ...(rings.length ? { boxShadow: [CELL[st].boxShadow, ...rings].filter(Boolean).join(",") } : null) };
              return html`<button key=${iso} role="gridcell" aria-selected=${iso === selected}
                aria-label=${`${longDate(iso)} : ${STATE_LABEL[st]}`} title=${`${shortDate(iso)} · ${STATE_LABEL[st]}`}
                onClick=${() => setSelected(iso)} onMouseEnter=${() => setHover(iso)} onMouseLeave=${() => setHover(null)}
                class="w-[9px] h-[9px] rounded-[2px] hover:scale-150 transition-transform" style=${style}></button>`;
            })}
          </div>
        </div>`;
      })}
    </div>
    <div class="mono text-[11px] text-muted text-center truncate">
      <span class="text-dim">›</span> <span class="capitalize ${focusState === "deadline" || focusState === "late" ? "text-red" : "text-txt"}">${shortDate(focus)}</span> · ${summary}
    </div>
  </section>`;
}

function DayRail({ items, selected, onToggle, onAdd, onRemove }) {

              : html`<button onClick=${() => onToggle(it.id)} aria-label=${it.done ? "Marquer à faire" : "Marquer comme fait"}
                  class="mt-0.5 h-4 w-4 shrink-0 rounded-[3px] grid place-items-center text-[10px] text-ink"
                  style=${it.done ? { background: "var(--ok)" } : { border: `1.5px solid ${st === "late" ? "var(--red)" : "var(--muted)"}` }}>${it.done ? "✓" : ""}</button>`}
            <div class="min-w-0 flex-1">
              <div class="text-sm ${it.done ? "line-through text-dim" : dl ? "text-red font-medium" : ""}">${it.title}</div>
              <div class="mono text-[11px] text-dim">${TYPES[it.type].label.toLowerCase()} · ${it.matiere || "—"}${st === "late" ? html` · <span class="text-red">en retard</span>` : ""}</div>
            </div>
            <button onClick=${() => onRemove(it.id)} aria-label="Supprimer" class="mono text-xs text-dim hover:text-red opacity-60 group-hover:opacity-100">×</button>
          </li>`;
        })}
      </ul>
      <form onSubmit=${submit} class="flex gap-2 p-3 border-t border-line">
        <label class="sr-only" htmlFor="add-title">Nouvel élément</label>
        <input id="add-title" value=${title} onInput=${(e) => setTitle(e.target.value)} placeholder="Ajouter…"
          class="flex-1 min-w-0 bg-panel2 border border-line rounded-[10px] px-2.5 py-1.5 text-sm outline-none focus:border-line2" />
        <label class="sr-only" htmlFor="add-type">Type</label>
        <select id="add-type" value=${type} onChange=${(e) => setType(e.target.value)}
          class="bg-panel2 border border-line rounded-[10px] px-2 py-1.5 mono text-xs">
          ${Object.entries(TYPES).map(([k, v]) => html`<option key=${k} value=${k}>${v.label}</option>`)}
        </select>
      </form>
    </section>

    <section class="rounded-2xl border border-line bg-panel" aria-labelledby="up-h">
      <h2 id="up-h" class="px-4 py-3 border-b border-line eyebrow">Échéances</h2>
      <ul>
        ${upcoming.map((d) => {
          const n = diffDays(TODAY, d.date);
          return html`<li key=${d.id} class="flex items-center gap-3 px-4 py-2.5 border-b border-line last:border-b-0">
            <span class="mono text-sm font-medium w-12 shrink-0 ${n <= 7 ? "text-red" : "text-txt"}">J−${n}</span>
            <div class="min-w-0"><div class="text-sm truncate">${d.title}</div><div class="mono text-[11px] text-dim">${shortDate(d.date)}</div></div>
          </li>`;
        })}
      </ul>
    </section>
  </aside>`;
}

function CelluleEntrainement({ sample }) {
  const [epreuve, setEpreuve] = useState("dissertation");
  const [dureeMin, setDureeMin] = useState(180);
  const [sujetType, setSujetType] = useState("contrats");
  const [sujetCustom, setSujetCustom] = useState("");
  const [locked, setLocked] = useState(true);

  const [active, setActive] = useState(false);
  const [timeLeft, setTimeLeft] = useState(180 * 60);
  const [copyText, setCopyText] = useState("");
  const [exits, setExits] = useState(0);
  const [submitting, setSubmitting] = useState(false);
  const [result, setResult] = useState(null);

  const SUJETS = {
    contrats: "La force obligatoire du contrat.",
    administratif: "Le juge administratif et la loi.",
    constitutionnel: "Le Conseil constitutionnel, juge des droits et libertés.",
  };

  useEffect(() => {
    if (!active) return;
    const t = setInterval(() => {
      setTimeLeft((s) => {
        if (s <= 1) { clearInterval(t); return 0; }
        return s - 1;
      });
    }, 1000);
    return () => clearInterval(t);
  }, [active]);

  useEffect(() => {
    if (!active || !locked) return;
    const handleVis = () => { if (document.hidden) setExits((n) => n + 1); };
    document.addEventListener("visibilitychange", handleVis);
    return () => document.removeEventListener("visibilitychange", handleVis);
  }, [active, locked]);

  const startExam = () => {
    setTimeLeft(dureeMin * 60);
    setExits(0);
    setCopyText("");
    setResult(null);
    setActive(true);
  };

  const submitExam = async () => {
    setActive(false);
    setSubmitting(true);
    const sujet = sujetType === "libre" ? (sujetCustom || "Sujet libre") : SUJETS[sujetType];
    const words = copyText.trim().split(/\s+/).filter(Boolean).length;
    try {
      const data = await askJson(sample, `${MENTOR}
Corrige cette copie d'examen de droit français (${epreuve}) sur le sujet : "${sujet}".
COPIE :
${copyText}
STATISTIQUES : ${words} mots, ${exits} sorties de page détectées.
Réponds uniquement en JSON valide :
{"note":15.5,"appreciation":"string","points_forts":["string"],"points_a_corriger":["string"]}`);
      setResult({ ...data, words, exits });
    } catch (e) {
      setActive(true);
      window.alert(errorText(e) + " Votre copie est conservée : cliquez de nouveau sur « Rendre la copie ».");
      return;
      setResult({
        note: 11.0,
        appreciation: "Copie honorable mais la structure de l'introduction pèche par manque de précision sur la qualification juridique.",
        points_forts: ["Bonne connaissance globale de la matière", "Style juridique correct"],
        points_a_corriger: ["Problème de droit manquant de généralité", "Développement en deux parties trop déséquilibré"],
        words,
        exits
      });
    } finally {
      setSubmitting(false);
    }
  };

  const fmtTime = (s) => `${pad(Math.floor(s / 3600))}:${pad(Math.floor((s % 3600) / 60))}:${pad(s % 60)}`;
  const sujetActif = sujetType === "libre" ? (sujetCustom || "Sujet libre à définir") : SUJETS[sujetType];

  if (active) {
    return html`<div class="fixed inset-0 z-50 flex flex-col bg-ink text-txt select-none" style=${{ background: "var(--exam)" }}>
      <header class="flex items-center justify-between px-6 py-4 border-b border-line bg-panel">
        <div class="flex items-center gap-4">
          <span class="eyebrow text-red">● Session sous tension</span>
          <span class="text-sm font-medium capitalize">${epreuve} · ${sujetActif}</span>
        </div>
        <div class="flex items-center gap-6">
          <div class="mono text-lg font-medium text-brass">${fmtTime(timeLeft)}</div>
          ${locked && exits > 0 && html`<span class="mono text-xs px-2.5 py-1 rounded bg-red-soft text-red">Avertissement : ${exits} sortie(s)</span>`}
          <button onClick=${() => { if (confirm("Abandonner l'épreuve ? Votre copie sera notée comme inachevée.")) { setActive(false); } }}
            class="mono text-xs px-3 py-1.5 rounded-lg border border-line text-muted hover:text-red">Abandonner</button>
        </div>
      </header>
      <div class="flex-1 grid lg:grid-cols-[300px_1fr] overflow-hidden">
        <aside class="hidden lg:flex flex-col gap-4 p-5 border-r border-line bg-panel overflow-y-auto text-xs text-muted">
          <div class="eyebrow text-txt">Sujet de l'épreuve</div>
          <p class="text-sm text-txt font-medium leading-relaxed">${sujetActif}</p>
          <hr class="border-line" />
          <div class="eyebrow text-txt">Règles de rigueur</div>
          <p>• Intitulés apparents obligatoires (pas de points d'interrogation dans les titres).</p>
          <p>• 15 minutes de relecture impératives avant de rendre la copie.</p>
          <p>• Zéro tolérance pour les citations approximatives.</p>
        </aside>
        <main class="flex flex-col p-6 overflow-y-auto">
          <textarea value=${copyText} onInput=${(e) => setCopyText(e.target.value)}
            placeholder="Rédigez votre composition ici (introduction, I, II avec chapitres et transitions)…"
            class="flex-1 w-full bg-transparent text-txt text-base leading-relaxed outline-none resize-none font-mono"></textarea>
          <div class="flex items-center justify-between pt-4 border-t border-line mt-4">
            <span class="mono text-xs text-dim">${copyText.trim().split(/\s+/).filter(Boolean).length} mots rédigés</span>
            <button onClick=${submitExam}
              class="mono text-xs px-5 py-2.5 rounded-xl text-ink font-medium hover:brightness-110" style=${{ background: "var(--brass)" }}>Rendre la copie</button>
          </div>
        </main>
      </div>
    </div>`;
  }

  return html`<div class="grid gap-6 lg:grid-cols-[1fr_360px] items-start">
    <div class="flex flex-col gap-4">
      <${PageHead} title="Cellule d'entraînement" sub="Conditions réelles : sujet imposé, temps limité, aucune aide extérieure. Votre copie est corrigée à la fin par le mentor." />
      ${submitting ? html`<div class="rounded-2xl border border-line bg-panel p-12 text-center flex flex-col items-center gap-3">
        <${Spinner} />
        <p class="text-sm text-muted">Correction de la copie selon le barème officiel…</p>
      </div>` : result ? html`<div class="rounded-2xl border border-line bg-panel p-6 flex flex-col gap-5">
        <div class="flex items-center justify-between pb-4 border-b border-line">
          <div><span class="eyebrow">Bilan de l'épreuve</span><h2 class="display text-2xl font-medium">Note : ${result.note} / 20</h2></div>
          <span class="mono text-xs text-dim">${result.words} mots · ${result.exits} sorties</span>
        </div>
        <p class="text-sm leading-relaxed">${result.appreciation}</p>
        <div class="grid sm:grid-cols-2 gap-4">
          <div class="p-4 rounded-xl bg-panel2 border border-line flex flex-col gap-2">
            <span class="eyebrow text-ok">Points forts</span>
            <ul class="list-disc pl-4 text-xs space-y-1">${result.points_forts.map((p, i) => html`<li key=${i}>${p}</li>`)}</ul>
          </div>
          <div class="p-4 rounded-xl bg-panel2 border border-line flex flex-col gap-2">
            <span class="eyebrow text-red">À corriger</span>
            <ul class="list-disc pl-4 text-xs space-y-1 text-red">${result.points_a_corriger.map((p, i) => html`<li key=${i}>${p}</li>`)}</ul>
          </div>
        </div>
        <button onClick=${() => setResult(null)} class="mono text-xs py-2 px-4 rounded-lg border border-line w-fit">Relancer une épreuve</button>
      </div>` : html`<div class="rounded-2xl border border-line bg-panel p-6 flex flex-col gap-5">
        <div class="flex flex-col gap-2">
          <span class="eyebrow">1. Type d'épreuve</span>
          <div class="grid grid-cols-3 gap-2">
            ${[["dissertation", "Dissertation"], ["cas pratique", "Cas pratique"], ["commentaire", "Commentaire d'arrêt"]].map(([k, l]) => html`
              <button key=${k} onClick=${() => setEpreuve(k)}
                class=${`py-2.5 px-3 rounded-xl border text-xs font-medium text-left ${epreuve === k ? "border-brass bg-brass-soft text-txt" : "border-line text-muted"}`}>${l}</button>
            `)}
          </div>
        </div>
        <div class="flex flex-col gap-2">
          <span class="eyebrow">2. Durée</span>
          <div class="grid grid-cols-3 gap-2">
            ${[[60, "1 h"], [90, "1 h 30"], [180, "3 h"]].map(([m, l]) => html`
              <button key=${m} onClick=${() => setDureeMin(m)}
                class=${`py-2 px-3 rounded-xl border text-xs font-medium ${dureeMin === m ? "border-brass bg-brass-soft text-txt" : "border-line text-muted"}`}>${l}</button>
            `)}
          </div>
        </div>
        <div class="flex flex-col gap-2">
          <span class="eyebrow">3. Sujet</span>
          <div class="flex flex-col gap-2">
            ${Object.entries(SUJETS).map(([k, s]) => html`
              <label key=${k} class=${`flex items-start gap-3 p-3 rounded-xl border cursor-pointer ${sujetType === k ? "border-brass bg-brass-soft text-txt" : "border-line text-muted"}`}>
                <input type="radio" name="sujet" checked=${sujetType === k} onChange=${() => setSujetType(k)} class="mt-0.5" />
                <div class="flex flex-col"><span class="text-xs uppercase text-dim">${k}</span><span class="text-sm font-medium">${s}</span></div>
              </label>
            `)}
            <label class=${`flex flex-col gap-2 p-3 rounded-xl border cursor-pointer ${sujetType === "libre" ? "border-brass bg-brass-soft text-txt" : "border-line text-muted"}`}>
              <div class="flex items-center gap-3">
                <input type="radio" name="sujet" checked=${sujetType === "libre"} onChange=${() => setSujetType("libre")} />
                <span class="text-xs font-medium uppercase">Sujet libre (collé)</span>
              </div>
              ${sujetType === "libre" && html`
                <textarea value=${sujetCustom} onInput=${(e) => setSujetCustom(e.target.value)} placeholder="Collez votre sujet de TD ici…"
                  rows="3" class="bg-panel2 border border-line rounded-lg p-2 text-sm outline-none font-mono"></textarea>
              `}
            </label>
          </div>
        </div>
        <div class="flex items-center justify-between pt-4 border-t border-line">
          <label class="flex items-center gap-2 cursor-pointer text-xs">
            <input type="checkbox" checked=${locked} onChange=${(e) => setLocked(e.target.checked)} class="rounded" />
            <span>Mode examen bloqué (comptage des sorties de page)</span>
          </label>
          <button onClick=${startExam}
            class="mono text-xs px-5 py-2.5 rounded-xl text-ink font-medium hover:brightness-110" style=${{ background: "var(--brass)" }}>Entrer en salle d'examen · ${dureeMin >= 60 ? `${dureeMin/60} h` : `${dureeMin} min`}</button>
        </div>
      </div>`}
    </div>

    <div class="flex flex-col gap-4">
      <${MentorNote} text="« La note en droit se gagne dans les vingt premières minutes : posez un plan irréprochable et un problème de droit chirurgical. »" />
    </div>
  </div>`;
}

async function askJson(sample, prompt, signal, model) {
  const token = await auth.token();
  let r;
  try {
    r = await fetch("/api/corriger", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify({ prompt, model }),
      signal
    });
  } catch { throw { code: "network" }; }
  if (r.status === 401) throw { code: "auth" };
  if (r.status === 400) throw { code: "prompt_too_large" };
  if (r.status === 429) throw { code: "rate_limited" };
  if (!r.ok) throw { code: "failed" };
  const { text } = await r.json();
  const s = (text || "").trim().replace(/^\x60{3}(?:json)?\s*/i, "").replace(/\s*\x60{3}$/, "");
  try { return JSON.parse(s); } catch {}
  const a = s.search(/[\[{]/), b = Math.max(s.lastIndexOf("}"), s.lastIndexOf("]"));
  if (a >= 0 && b > a) { try { return JSON.parse(s.slice(a, b + 1)); } catch {} }
  throw { code: "invalid_json" };
}

const loadScript = (src) => new Promise((res, rej) => {
  const s = document.createElement("script");
  s.src = src; s.onload = res; s.onerror = () => rej({ code: "lib" });
  document.head.appendChild(s);

async function readPdf(file) {
  if (!window.pdfjsLib) await loadScript(PDFJS_SRC);
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
  const pdf = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  let out = "";
  for (let p = 1; p <= pdf.numPages; p++) {
    const tc = await (await pdf.getPage(p)).getTextContent();
    for (const it of tc.items) out += it.str + (it.hasEOL ? "\n" : "");
    out += "\n\n";
  }
  if (out.replace(/\s/g, "").length < pdf.numPages * 80) throw { code: "scan" };
  return out;
}
async function readDocx(file) {
  if (!window.mammoth) await loadScript(MAMMOTH_SRC);
  const r = await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
  return r.value || "";
}
async function readFileText(file) {
  const name = (file.name || "").toLowerCase();
  if (file.size > MAX_FILE) throw { code: "big" };
  if (name.endsWith(".pdf") || file.type === "application/pdf") return readPdf(file);
  if (name.endsWith(".docx")) return readDocx(file);
  if (name.endsWith(".txt") || name.endsWith(".md") || file.type === "text/plain") return file.text();
  throw { code: "format" };
}

function chunkText(t, size = 12000) {
  const out = [];
  let i = 0;
  while (i < t.length) {
    let end = Math.min(i + size, t.length);
    if (end < t.length) { const cut = t.lastIndexOf("\n", end); if (cut > i + size * 0.6) end = cut; }
    out.push(t.slice(i, end));
    i = end;
  }
  return out;
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function askRetry(prompt, model) {

  for (let k = 0; ; k++) {

    catch (e) {
      if (e && e.code === "rate_limited" && k < waits.length) { await sleep(waits[k]); continue; }
      throw e;
    }
  }
}
async function analyzeChunk(matiere, chunk, i, n) {
  const prompt = `Voici ${n > 1 ? `la partie ${i + 1} sur ${n} des` : "les"} notes de cours d'un étudiant en droit, matière : ${matiere}. Extrais-en uniquement ce qui y figure, sans rien ajouter de ton cru.
Réponds uniquement en JSON valide :
{"plan":["intitulé de chapitre ou de partie (8 au maximum)"],"notions":["notion clé (8 au maximum)"],"arrets":["arrêt ou texte cité, avec sa date (8 au maximum)"]}
NOTES :
${chunk}`;
  try { return await askRetry(prompt, "claude-haiku-5-5"); }
  catch (e) {
    if (e && (e.code === "failed" || e.code === "invalid_json")) return await askRetry(prompt);
    throw e;
  }
}
async function analyzeCours(matiere, notes, onProgress) {
  const chunks = chunkText(notes.slice(0, COURS_CAP));
  const results = new Array(chunks.length).fill(null);
  let next = 0, done = 0, skipped = 0, fatal = null;
  const worker = async () => {
    while (!fatal) {
      const i = next++;
      if (i >= chunks.length) return;
      try { results[i] = await analyzeChunk(matiere, chunks[i], i, chunks.length); }
      catch (e) {
        if (e && e.code === "invalid_json") skipped++;
        else { fatal = e || { code: "failed" }; return; }
      }
      done++;
      if (onProgress) onProgress(done, chunks.length);
    }
  };
  await Promise.all(Array.from({ length: Math.min(3, chunks.length) }, worker));
  if (fatal) throw fatal;
  const acc = { plan: [], notions: [], arrets: [] };
  for (const data of results) {
    if (!data) continue;
    for (const k of ["plan", "notions", "arrets"]) {
      for (const v of (Array.isArray(data[k]) ? data[k] : [])) {
        const s = clean(v, 120);
        if (s && !acc[k].some((x) => x.toLowerCase() === s.toLowerCase())) acc[k].push(s);
      }
    }
  }
  for (const k of Object.keys(acc)) acc[k] = acc[k].slice(0, 60);
  if (!acc.plan.length && !acc.notions.length && !acc.arrets.length) throw { code: "invalid_json" };
  return { digest: acc, skipped };
}

}

/* ===== Test de départ ===== */
const QZ_KEY = "mj_quiz";
const getQuiz = () => { const q = store.get(QZ_KEY, null); return q && Array.isArray(q.results) ? q : { results: [], diag: null }; };
const saveQuiz = (q) => store.set(QZ_KEY, q);
const hasResults = () => getQuiz().results.some((r) => !r.flagged);
const anyDigest = () => Object.values(getCours()).some((v) => v && v.digest);
const BLOCAGES = ["Comprendre le cours", "Retenir et mémoriser", "Manque de temps", "M'organiser", "Rien de précis"];
const STATUS_COLOR = { rouge: "var(--red)", orange: "var(--brass)", vert: "var(--ok)" };
const STATUS_LABEL = { rouge: "À reprendre", orange: "À consolider", vert: "Acquis" };

const QZ = { s: { phase: "intro" }, subs: new Set() };
function setQZ(p) { QZ.s = { ...QZ.s, ...(typeof p === "function" ? p(QZ.s) : p) }; QZ.subs.forEach((f) => f()); }
function useQZ() {
  const [, force] = useState(0);
  useEffect(() => { const f = () => force((x) => x + 1); QZ.subs.add(f); return () => QZ.subs.delete(f); }, []);
  return QZ.s;
}

function bilanFor(results) {
  const groups = {};
  for (const r of results) {
    if (r.flagged) continue;
    const key = r.matiere + "|" + String(r.chapitre).toLowerCase();
    (groups[key] = groups[key] || []).push(r);
  }
  return Object.values(groups).map((g) => {
    const last = g.slice(-4);
    const ok = last.filter((r) => r.ok).length, ko = last.length - ok;
    return { matiere: last[0].matiere, chapitre: last[last.length - 1].chapitre, ok, ko, status: ko === 0 ? "vert" : ok === 0 ? "rouge" : "orange" };
  });
}
function testContext() {
  const q = getQuiz();
  let s = "";
  if (q.diag) {
    const conf = Object.entries(q.diag.conf || {}).map(([m, n]) => `${m} ${n}/5`).join(", ");
    if (conf || q.diag.blocage) s += ` Ressenti de l'étudiant :${conf ? " confiance " + conf + "." : ""}${q.diag.blocage ? " blocage principal : " + q.diag.blocage.toLowerCase() + "." : ""}`;
  }
  const b = bilanFor(q.results);
  if (b.length) {
    const L = (st) => b.filter((x) => x.status === st).slice(0, 6).map((x) => `${x.chapitre} (${x.matiere})`).join(" ; ");
    const parts = [["à reprendre en priorité", L("rouge")], ["à consolider", L("orange")], ["acquis", L("vert")]].filter(([, v]) => v).map(([k, v]) => `${k} : ${v}`);
    s += ` Résultats du test de départ — ${parts.join(". ")}.`;
  }
  return s.slice(0, 1000);
}

function spreadPick(n, k) {
  if (k >= n) return Array.from({ length: n }, (_, i) => i);
  const out = [];
  for (let j = 0; j < k; j++) {
    const lo = Math.floor((j * n) / k), hi = Math.max(lo + 1, Math.floor(((j + 1) * n) / k));
    out.push(lo + Math.floor(Math.random() * (hi - lo)));
  }
  return out;
}
function shuffled(a) {
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; }
  return b;
}
function quizPrompt(matiere, chunk, q, plan) {
  return `Voici un extrait des notes de cours d'un étudiant en droit, matière : ${matiere}. Rédige ${q} question${q > 1 ? "s" : ""} à choix multiple pour tester sa compréhension, en t'appuyant uniquement sur cet extrait.
Règles : 4 propositions dont une seule exacte ; les 3 autres sont plausibles mais fausses d'après l'extrait. Varie les types : notion à définir, petit cas concret à qualifier, solution d'un arrêt. Évite les détails sans enjeu. Ne pose aucune question dont la réponse ne figure pas dans l'extrait.
"chapitre" : choisis dans cette liste l'intitulé le plus proche de la partie concernée, sinon formule-le en 6 mots au maximum : ${plan}
"explication" : une seule phrase courte (25 mots maximum) qui justifie la bonne réponse par la règle de droit (article, principe) ou par l'arrêt qui la pose ; n'écris jamais « parce que le cours le dit » ni « selon le cours ».
Réponds uniquement en JSON : [{"chapitre":"...","question":"...","choix":["...","...","...","..."],"bonne":0,"explication":"..."}] où "bonne" est l'indice (0 à 3) de la bonne proposition.
EXTRAIT :
${chunk}`;
}
function cleanQuestions(raw, matiere) {
  const arr = Array.isArray(raw) ? raw : (raw && Array.isArray(raw.questions) ? raw.questions : []);
  const out = [];
  for (const x of arr) {
    if (!x || typeof x.question !== "string" || !Array.isArray(x.choix) || x.choix.length !== 4) continue;
    const bonne = Number(x.bonne);
    if (!Number.isInteger(bonne) || bonne < 0 || bonne > 3) continue;
    const ch = x.choix.map((c) => clean(c, 220));
    if (ch.some((c) => !c) || new Set(ch.map((c) => c.toLowerCase())).size < 4) continue;
    const q = clean(x.question, 420);
    if (q.length < 12) continue;
    out.push({ id: uid(), matiere, chapitre: clean(x.chapitre, 80) || "Divers", q, opts: shuffled(ch.map((t, i) => ({ t, ok: i === bonne }))), why: clean(x.explication, 420) });
  }
  return out;
}
async function genTest(subjects, onProgress) {
  const jobs = [];
  for (const s of subjects) {
    const all = chunkText(s.notes.slice(0, COURS_CAP));
    const total = Math.max(4, Math.min(8, Math.round(s.notes.length / 2500)));
    const k = Math.min(4, all.length, total);
    const base = Math.floor(total / k), extra = total % k;
    spreadPick(all.length, k).forEach((ci, j) => jobs.push({ m: s.m, chunk: all[ci], q: base + (j < extra ? 1 : 0), plan: s.plan }));
  }
  const res = new Map(subjects.map((s) => [s.m, []]));
  let next = 0, done = 0, fatal = null, lastErr = null;
  const worker = async () => {
    while (!fatal) {
      const i = next++;
      if (i >= jobs.length) return;
      const j = jobs[i];
      try { res.get(j.m).push(...cleanQuestions(await askRetry(quizPrompt(j.m, j.chunk, j.q, j.plan)), j.m)); }
      catch (e) {
        if (e && (e.code === "invalid_json" || e.code === "failed")) lastErr = e;
        else { fatal = e || { code: "failed" }; return; }
      }
      done++;
      if (onProgress) onProgress(done, jobs.length);
    }
  };
  await Promise.all(Array.from({ length: Math.min(4, jobs.length) }, worker));
  if (fatal) throw fatal;
  const out = [];
  for (const s of subjects) {
    const seen = new Set();
    const uniq = res.get(s.m).filter((x) => { const k = x.q.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; });
    if (uniq.length < 3) throw lastErr || { code: "invalid_json" };
    out.push(...uniq);
  }
  return out;
}

function planFromBilan(setItems) {
  const b = bilanFor(getQuiz().results).filter((x) => x.status !== "vert");
  const cur = store.get("mj_items", []);
  const urg = (m) => {
    const d = cur.filter((i) => i.type === "partiel" && i.matiere === m && i.date >= TODAY).map((i) => diffDays(TODAY, i.date)).sort((x, y) => x - y)[0];
    return d === undefined ? 1 : 1 + 7 / (d + 7);
  };
  const top = b.map((x) => ({ ...x, score: (x.status === "rouge" ? 1 : 0.5) * urg(x.matiere) })).sort((x, y) => y.score - x.score).slice(0, 6);
  const per = Math.max(1, parseInt((((store.get("mj_profile", null) || {}).rythme || "").match(/\d/) || ["1"])[0], 10));
  const tasks = top.map((x, i) => ({ id: uid(), date: isoIn(Math.floor(i / per)), title: `Revoir ${x.chapitre} (${x.matiere})`, type: "revision", matiere: x.matiere, done: false, src: "test" }));
  setItems((xs) => [...xs.filter((i) => !(i.src === "test" && !i.done)).map((i) => i.go === "test" && !i.done ? { ...i, done: true, doneOn: TODAY } : i), ...tasks]);
  return tasks.length;
}
function ensureTestNudge(setItems) {
  if (!setItems || !anyDigest() || hasResults()) return;
  const m = Object.keys(getCours()).find((k) => (getCours()[k] || {}).digest);
  setItems((xs) => xs.some((i) => i.go === "test") ? xs : [...xs, { id: uid(), date: TODAY, title: "Fais ton test de départ", type: "tache", matiere: m, done: false, go: "test" }]);
}

function bilanSentence(b) {
  const by = (st) => b.filter((x) => x.status === st);
  const names = (a) => a.slice(0, 3).map((x) => `« ${x.chapitre} »`).join(", ");
  const r = by("rouge"), o = by("orange"), v = by("vert");
  if (!b.length) return "";
  if (r.length) return `Priorité : ${names(r)}.${o.length ? ` Ensuite à consolider : ${names(o)}.` : ""}${v.length ? ` Le reste tient : ${v.length} partie${v.length > 1 ? "s" : ""} acquise${v.length > 1 ? "s" : ""}.` : ""}`;
  if (o.length) return `Pas de point noir. À consolider : ${names(o)}.${v.length ? ` ${v.length} partie${v.length > 1 ? "s" : ""} acquise${v.length > 1 ? "s" : ""}.` : ""}`;
  return "Tout ce qui a été testé est acquis. Refais un test dans quelques jours pour vérifier que ça tient.";
}

function TestDepart({ setItems, setPage }) {
  const s = useQZ();
  useEffect(() => () => { if (QZ.s.phase === "result") QZ.s = { ...QZ.s, phase: "intro", again: false }; }, []);
  const prof = store.get("mj_profile", null) || {};
  const cours = getCours();
  const ready = [...new Set([...(prof.matieres || []), ...Object.keys(cours)])].filter((m) => cours[m] && cours[m].digest && (cours[m].notes || "").trim());
  const sel = s.sel || Object.fromEntries(ready.map((m) => [m, true]));
  const chosen = ready.filter((m) => sel[m]);
  const conf = s.conf || {};

  const start = async () => {
    if (!chosen.length) return;
    const q = getQuiz();
    q.diag = { conf: Object.fromEntries(chosen.filter((m) => conf[m]).map((m) => [m, conf[m]])), blocage: s.blocage || "", at: TODAY };
    saveQuiz(q); refreshContext();
    setQZ({ phase: "gen", prog: [0, 1], err: "" });
    try {
      const subjects = chosen.map((m) => ({ m, notes: cours[m].notes, plan: (cours[m].digest.plan || []).join(" ; ").slice(0, 1500) }));
      const questions = await genTest(subjects, (d, n) => setQZ({ prog: [d, n] }));
      setQZ({ phase: "quiz", questions, idx: 0, picked: null, flagged: false, answered: 0 });
    } catch (e) { setQZ({ phase: "error", err: errorText(e) }); }
  };
  const record = (ok, idk, i) => {
    const q = s.questions[s.idx];
    const st = getQuiz();
    st.results.push({ id: q.id, matiere: q.matiere, chapitre: q.chapitre, ok, idk, date: TODAY, q: q.q.slice(0, 160) });
    st.results = st.results.slice(-400);
    saveQuiz(st);
    bankAdd(q, ok);
    setQZ({ picked: i, flagged: false, answered: (s.answered || 0) + 1 });
  };
  const flag = () => {
    const q = s.questions[s.idx];
    const st = getQuiz();
    const r = st.results.find((x) => x.id === q.id);
    if (r) r.flagged = true;
    saveQuiz(st);
    bankRemove(q.id);
    setQZ({ flagged: true });
  };
  const finish = () => {
    refreshContext();
    const n = hasResults() ? planFromBilan(setItems) : 0;
    refreshContext();
    setQZ({ phase: "result", nTasks: n, again: false });
  };
  const next = () => {
    if (s.idx + 1 >= s.questions.length) return finish();
    setQZ({ idx: s.idx + 1, picked: null, flagged: false });
  };

  if (s.phase === "gen") {
    const [d, n] = s.prog || [0, 1];
    return html`<div class="flex flex-col gap-4 max-w-3xl">
      <${PageHead} title="Test de départ" sub="Le mentor prépare tes questions à partir de tes notes." />
      <div class="rounded-2xl border border-line bg-panel p-5 flex flex-col gap-3" role="status">
        <div class="flex items-center gap-2 text-sm"><${Spinner} /> Préparation des questions… ${d}/${n}</div>
        <div class="h-1.5 rounded-full overflow-hidden" style=${{ background: "var(--panel-2)" }}><div class="h-full" style=${{ width: Math.round((100 * d) / n) + "%", background: "var(--brass)", transition: "width .3s" }}></div></div>
        <p class="text-xs text-dim">Compte 20 à 40 secondes.</p>
      </div>
    </div>`;
  }
  if (s.phase === "error") {
    return html`<div class="flex flex-col gap-4 max-w-3xl">
      <${PageHead} title="Test de départ" />
      <div role="alert" class="rounded-xl p-3 border text-xs" style=${{ borderColor: "rgba(255,59,78,.3)", background: "var(--red-soft)", color: "var(--red)" }}>${s.err}</div>
      <div><button type="button" onClick=${() => setQZ({ phase: "intro", err: "" })} class="mono text-xs px-4 py-2 rounded-[10px] text-ink font-medium hover:brightness-110" style=${{ background: "var(--brass)" }}>Réessayer</button></div>
    </div>`;
  }
  if (s.phase === "quiz") {
    const q = s.questions[s.idx];
    const total = s.questions.length;
    const answered = s.picked !== null && s.picked !== undefined;
    const good = q.opts.findIndex((o) => o.ok);
    return html`<div class="flex flex-col gap-4 max-w-3xl">
      <div class="flex items-center justify-between gap-3">
        <span class="mono text-xs text-muted">${q.matiere} · ${q.chapitre}</span>
        <span class="mono text-xs text-dim shrink-0">Question ${s.idx + 1} sur ${total}</span>
      </div>
      <div class="h-1 rounded-full overflow-hidden" style=${{ background: "var(--panel-2)" }}><div class="h-full" style=${{ width: Math.round((100 * (s.idx + (answered ? 1 : 0))) / total) + "%", background: "var(--brass)", transition: "width .3s" }}></div></div>
      <h2 class="display text-[1.15rem] leading-snug" id="qz-q">${q.q}</h2>
      <div class="flex flex-col gap-2" role="group" aria-labelledby="qz-q">
        ${q.opts.map((o, i) => {
          const picked = s.picked === i;
          const style = !answered ? {} : o.ok ? { borderColor: "var(--ok)", background: "rgba(79,191,139,.10)" } : picked ? { borderColor: "var(--red)", background: "var(--red-soft)" } : { opacity: 0.55 };
          return html`<button key=${i} type="button" disabled=${answered} onClick=${() => record(o.ok, false, i)}
            class="qz-opt w-full text-left rounded-xl border border-line bg-panel px-4 py-3 text-sm flex gap-3 hover:border-line2 disabled:cursor-default" style=${style}>
            <span class="mono text-xs text-dim pt-0.5">${"ABCD"[i]}</span><span>${o.t}</span></button>`;
        })}
        ${!answered && html`<button type="button" onClick=${() => record(false, true, -1)} class="qz-idk mono text-xs px-4 py-2 rounded-[10px] border border-line text-muted hover:text-txt self-start">Je ne sais pas</button>`}
      </div>
      ${answered && html`<div class="rounded-xl border border-line p-3 text-sm flex flex-col gap-2" style=${{ background: "var(--panel-2)" }} role="status">
        <p><span class="font-medium" style=${{ color: s.picked === good ? "var(--ok)" : "var(--red)" }}>${s.picked === good ? "Bonne réponse." : s.picked === -1 ? "Pas de souci, c'est utile à savoir." : "Pas tout à fait."}</span>
          ${s.picked !== good && html` La bonne réponse est ${"ABCD"[good]}.`}</p>
        ${q.why && html`<p class="text-muted">${q.why}</p>`}
      </div>`}
      <div class="flex flex-wrap items-center gap-2">
        ${answered && html`<button type="button" id="qz-next" onClick=${next} class="mono text-xs px-4 py-2 rounded-[10px] text-ink font-medium hover:brightness-110" style=${{ background: "var(--brass)" }}>${s.idx + 1 >= total ? "Voir mon bilan" : "Suivant →"}</button>`}
        ${answered && html`<button type="button" id="qz-flag" onClick=${flag} disabled=${s.flagged} class="mono text-xs px-3 py-2 text-dim hover:text-txt disabled:opacity-70">${s.flagged ? "✓ Question écartée" : "Question fausse ou mal posée"}</button>`}
        <button type="button" id="qz-stop" onClick=${() => (s.answered ? finish() : setQZ({ phase: "intro" }))} class="mono text-xs px-3 py-2 text-dim hover:text-txt ml-auto">Arrêter</button>
      </div>
    </div>`;
  }
  if (s.phase === "result" || (s.phase === "intro" && hasResults() && !s.again)) {
    return html`<${BilanView} fresh=${s.phase === "result"} nTasks=${s.nTasks || 0} setPage=${setPage} onAgain=${() => setQZ({ phase: "intro", again: true })} />`;
  }
  // intro
  const todo = (prof.matieres || []).filter((m) => !ready.includes(m));
  return html`<div class="flex flex-col gap-4 max-w-3xl">
    <${PageHead} title="Test de départ" sub="Des questions tirées de tes propres notes. En quelques minutes, le mentor voit ce que tu maîtrises et ce qu'il faut reprendre en premier." />
    ${ready.length === 0 && html`<div class="rounded-2xl border border-line bg-panel p-5 flex flex-col gap-3">
      <p class="text-sm">Pour préparer le test, le mentor a d'abord besoin d'un cours analysé.</p>
      <div><button type="button" onClick=${() => setPage("cours")} class="mono text-xs px-4 py-2 rounded-[10px] text-ink font-medium hover:brightness-110" style=${{ background: "var(--brass)" }}>Aller à Mes cours →</button></div>
    </div>`}
    ${ready.length > 0 && html`<section class="rounded-2xl border border-line bg-panel p-4 flex flex-col gap-3">
      <div class="eyebrow">Matières à tester</div>
      <div class="flex flex-wrap gap-2">${ready.map((m) => html`<${OChip} key=${m} on=${!!sel[m]} onClick=${() => setQZ({ sel: { ...sel, [m]: !sel[m] } })}>${m}<//>`)}</div>
      ${todo.length > 0 && html`<p class="text-xs text-dim">Pas encore analysé : ${todo.join(", ")}.</p>`}

    <section class="rounded-2xl border border-line bg-panel p-4 flex flex-col gap-3">
      <div class="eyebrow">Ton ressenti · facultatif</div>
      ${chosen.map((m) => html`<div key=${m} class="flex flex-col gap-1.5">
        <span class="text-sm">${m} : à quel point te sens-tu prêt ?</span>
        <div class="flex flex-wrap gap-2">${[1, 2, 3, 4, 5].map((n) => html`<${OChip} key=${n} on=${conf[m] === n} onClick=${() => setQZ({ conf: { ...conf, [m]: n } })}>${n}<//>`)}</div>
      </div>`)}

      <span class="text-sm pt-1">Ce qui te bloque le plus en ce moment :</span>

    </section>

      <p class="text-xs text-dim max-w-[60ch]">Environ ${Math.max(3, chosen.length * 4)} minutes. Quand tu hésites, réponds « Je ne sais pas » plutôt que de deviner : le mentor te lira mieux.</p>
    </div>`}
  </div>`;
}

/* ===== Question du jour ===== */
const BANK_KEY = "mj_qbank", DAILY_KEY = "mj_daily";
const DAILY_MAX = 3, INTERVALS = [1, 3, 7, 16];
const getBank = () => { const b = store.get(BANK_KEY, []); return Array.isArray(b) ? b : []; };
const saveBank = (b) => store.set(BANK_KEY, b.slice(-300));
function bankAdd(q, ok) {
  const box = ok ? 1 : 0;
  const b = getBank().filter((x) => x.id !== q.id);
  b.push({ id: q.id, matiere: q.matiere, chapitre: q.chapitre, q: q.q, opts: q.opts, why: q.why, box, due: isoIn(INTERVALS[box]) });
  saveBank(b);
}
function bankUpdate(id, ok) {
  const b = getBank();
  const x = b.find((e) => e.id === id);
  if (!x) return;
  x.box = ok ? Math.min(3, x.box + 1) : 0;
  x.due = isoIn(INTERVALS[x.box]);
  saveBank(b);
}
const bankRemove = (id) => saveBank(getBank().filter((x) => x.id !== id));
const getDaily = () => { const d = store.get(DAILY_KEY, null); return d && d.date === TODAY ? d : { date: TODAY, done: 0, ok: 0, ids: [] }; };
const dueQuestions = () => {
  const d = getDaily();
  return getBank().filter((x) => x.due <= TODAY && !d.ids.includes(x.id)).sort((a, b) => a.due.localeCompare(b.due) || a.box - b.box);
};

function DailyQuestion() {
  const [cur, setCur] = useState(null);
  const [picked, setPicked] = useState(null);
  const [flagged, setFlagged] = useState(false);
  const [, force] = useState(0);
  const daily = getDaily();
  const due = dueQuestions();
  const q = cur || (daily.done < DAILY_MAX ? due[0] : null);
  const answered = picked !== null;

  if (!q) {
    if (!daily.done) return null;
    return html`<section class="rounded-2xl border border-line bg-panel px-5 py-3 flex items-center gap-3 text-sm" aria-label="Question du jour">
      <span style=${{ color: "var(--ok)" }}>✓</span><span>Question du jour faite · ${daily.ok}/${daily.done}. Reviens demain pour la suite.</span></section>`;
  }
  const total = Math.min(DAILY_MAX, daily.done + due.length);
  const num = answered ? daily.done : daily.done + 1;
  const good = q.opts.findIndex((o) => o.ok);
  const answer = (i) => {
    const ok = i >= 0 && q.opts[i].ok;
    setCur(q); setPicked(i); setFlagged(false);
    bankUpdate(q.id, ok);
    const d = getDaily();
    d.ids = [...d.ids, q.id]; d.done += 1; d.ok += ok ? 1 : 0;
    store.set(DAILY_KEY, d);
    const st = getQuiz();
    st.results.push({ id: q.id, matiere: q.matiere, chapitre: q.chapitre, ok, idk: i < 0, date: TODAY, q: q.q.slice(0, 160), daily: true });
    st.results = st.results.slice(-400);
    saveQuiz(st);
    refreshContext();
  };
  const flag = () => {
    setFlagged(true);
    bankRemove(q.id);
    const st = getQuiz();
    st.results.forEach((r) => { if (r.id === q.id) r.flagged = true; });
    saveQuiz(st);
  };
  const next = () => { setCur(null); setPicked(null); setFlagged(false); force((x) => x + 1); };

  return html`<section class="rounded-2xl border border-line bg-panel" aria-label="Question du jour">
    <div class="flex items-center justify-between gap-3 px-5 sm:px-6 py-2.5 border-b border-line">
      <span class="eyebrow">Question du jour · ${q.matiere}</span>
      <span class="mono text-xs text-dim shrink-0">${num} sur ${total}</span>
    </div>
    <div class="px-5 sm:px-6 py-4 flex flex-col gap-3">
      <p class="display text-[1.05rem] leading-snug" id="dq-q">${q.q}</p>
      <div class="flex flex-col gap-2" role="group" aria-labelledby="dq-q">
        ${q.opts.map((o, i) => {
          const style = !answered ? {} : o.ok ? { borderColor: "var(--ok)", background: "rgba(79,191,139,.10)" } : picked === i ? { borderColor: "var(--red)", background: "var(--red-soft)" } : { opacity: 0.55 };
          return html`<button key=${i} type="button" disabled=${answered} onClick=${() => answer(i)}
            class="dq-opt w-full text-left rounded-xl border border-line px-4 py-2.5 text-sm flex gap-3 hover:border-line2 disabled:cursor-default" style=${style}>
            <span class="mono text-xs text-dim pt-0.5">${"ABCD"[i]}</span><span>${o.t}</span></button>`;
        })}
        ${!answered && html`<button type="button" onClick=${() => answer(-1)} class="dq-idk mono text-xs px-4 py-2 rounded-[10px] border border-line text-muted hover:text-txt self-start">Je ne sais pas</button>`}
      </div>
      ${answered && html`<div class="rounded-xl border border-line p-3 text-sm flex flex-col gap-1.5" style=${{ background: "var(--panel-2)" }} role="status">
        <p><span class="font-medium" style=${{ color: picked === good ? "var(--ok)" : "var(--red)" }}>${picked === good ? "Bonne réponse." : picked === -1 ? "Pas de souci, elle reviendra." : "Pas tout à fait."}</span>
          ${picked !== good && html` La bonne réponse est ${"ABCD"[good]}.`}</p>
        ${q.why && html`<p class="text-muted">${q.why}</p>`}
      </div>`}
      ${answered && html`<div class="flex flex-wrap items-center gap-2">
        <button type="button" id="dq-next" onClick=${next} class="mono text-xs px-4 py-2 rounded-[10px] text-ink font-medium hover:brightness-110" style=${{ background: "var(--brass)" }}>${daily.done >= DAILY_MAX || due.length === 0 ? "Terminer" : "Suivante →"}</button>
        <button type="button" id="dq-flag" onClick=${flag} disabled=${flagged} class="mono text-xs px-3 py-2 text-dim hover:text-txt disabled:opacity-70">${flagged ? "✓ Question écartée" : "Question fausse ou mal posée"}</button>
      </div>`}
    </div>
  </section>`;
}

const INVITE = (() => {
  try {
    const q = new URLSearchParams(location.search), c = (q.get("invite") || "").trim();
    if (c) { sessionStorage.setItem("mj_invite", c); q.delete("invite"); history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q : "") + location.hash); }
    return sessionStorage.getItem("mj_invite") || "";
  } catch { return ""; }
})();

function AuthScreen({ onIn, notice }) {
  const [mode, setMode] = useState(INVITE ? "signup" : "login");
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [code, setCode] = useState(INVITE);
  const [showCode, setShowCode] = useState(!INVITE);
  const [err, setErr] = useState("");
  const [info, setInfo] = useState(notice || "");
  const [busy, setBusy] = useState(false);
  const go = (m) => { setMode(m); setErr(""); setInfo(""); };

  async function submit(e) {
    e.preventDefault();
    setErr(""); setInfo("");
    const mail = email.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)) return setErr(AUTH_ERRORS.invalid_email);
    if (mode !== "forgot" && pw.length < (mode === "signup" ? 8 : 1)) return setErr(mode === "signup" ? AUTH_ERRORS.weak_password : "Entre ton mot de passe.");
    if (mode === "signup" && !code.trim()) return setErr("Entre le code d'invitation qu'on t'a donné.");
    setBusy(true);
    try {
      if (mode === "forgot") { await auth.recover(mail); setInfo("Si un compte existe pour cette adresse, un e-mail vient de partir. Ouvre le lien qu'il contient."); }
      else {
        if (mode === "signup") { await auth.signUp(mail, pw, code.trim()); try { sessionStorage.removeItem("mj_invite"); } catch {} }
        else await auth.signIn(mail, pw);
        onIn();
      }
    } catch (x) { if (x && x.code === "bad_code") setShowCode(true); setErr(authErr(x)); }
    setBusy(false);
  }

  const invited = mode === "signup" && !showCode;
  const titles = { login: "Connexion", signup: invited ? "Ton accès est prêt" : "Créer ton compte", forgot: "Mot de passe oublié" };
  const subs = { login: "Retrouve ton calendrier, tes cours et tes tests sur tous tes appareils.", signup: invited ? "Choisis ton e-mail et un mot de passe : ton mentor t'attend juste après." : "L'accès se fait sur invitation pendant la bêta.", forgot: "Entre ton e-mail : tu recevras un lien pour choisir un nouveau mot de passe." };
  return html`<${AuthShell} title=${titles[mode]} sub=${subs[mode]}>
    <form onSubmit=${submit} class="flex flex-col gap-4" noValidate>
      <div class="flex flex-col gap-1.5">
        <label class="eyebrow" htmlFor="au-email">E-mail</label>
        <input id="au-email" type="email" autoComplete="email" value=${email} onInput=${(e) => setEmail(e.target.value)} class=${OINPUT} />
      </div>
      ${mode !== "forgot" && html`<div class="flex flex-col gap-1.5">
        <label class="eyebrow" htmlFor="au-pw">Mot de passe</label>
        <input id="au-pw" type="password" autoComplete=${mode === "signup" ? "new-password" : "current-password"} value=${pw} onInput=${(e) => setPw(e.target.value)} class=${OINPUT} placeholder=${mode === "signup" ? "8 caractères minimum" : ""} />
      </div>`}
      ${invited && html`<p id="au-invited" class="text-xs" style=${{ color: "var(--ok)" }}>✓ Invitation appliquée</p>`}
      ${mode === "signup" && showCode && html`<div class="flex flex-col gap-1.5">
        <label class="eyebrow" htmlFor="au-code">Code d'invitation</label>
        <input id="au-code" type="password" autoComplete="off" value=${code} onInput=${(e) => setCode(e.target.value)} class=${OINPUT} placeholder="Le code qu'on t'a donné" />
      </div>`}
      ${err && html`<p id="au-err" class="text-sm" style=${{ color: "var(--red)" }}>${err}</p>`}
      ${info && html`<p id="au-info" class="text-sm" style=${{ color: "var(--ok)" }}>${info}</p>`}
      <button id="au-submit" type="submit" disabled=${busy} class=${BTN} style=${{ background: "var(--brass)" }}>
        ${busy && html`<${Spinner} />`} ${mode === "login" ? "Se connecter" : mode === "signup" ? "Créer mon compte" : "Envoyer le lien"}</button>
      <div class="flex flex-wrap justify-between gap-2 text-xs">
        ${mode === "login"
          ? html`<button type="button" id="au-to-signup" onClick=${() => go("signup")} class="text-muted hover:text-txt">J'ai un code d'invitation</button>
                 <button type="button" id="au-to-forgot" onClick=${() => go("forgot")} class="text-muted hover:text-txt">Mot de passe oublié ?</button>`
          : html`<button type="button" id="au-to-login" onClick=${() => go("login")} class="text-muted hover:text-txt">← J'ai déjà un compte</button>`}
      </div>
      ${mode === "signup" && html`<p class="text-xs text-dim">Ton compte et tes données sont hébergés dans l'Union européenne (Supabase, Paris). Les textes que tu soumets sont traités par une IA (Anthropic). Tu peux supprimer ton compte à tout moment. <a href="/landing.html#confidentialite" target="_blank" rel="noopener" class="underline" style=${{ color: "var(--brass)" }}>Confidentialité</a></p>`}
    </form>
  <//>`;
}

function readRecovery() {
  const h = new URLSearchParams(location.hash.replace(/^#/, ""));
  if (h.get("error_code") || h.get("error")) { history.replaceState(null, "", location.pathname); return { error: true }; }
  if (h.get("type") === "recovery" && h.get("access_token")) {
    history.replaceState(null, "", location.pathname);
    return { access_token: h.get("access_token"), refresh_token: h.get("refresh_token"), expires_in: h.get("expires_in"), expires_at: Number(h.get("expires_at")) || undefined };
  }
  return null;
}

function NewPassword({ rec, onDone }) {
  const [pw, setPw] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  async function submit(e) {
    e.preventDefault();
    if (pw.length < 8) return setErr(AUTH_ERRORS.weak_password);
    setBusy(true); setErr("");
    try {
      await auth.setPassword(pw, rec.access_token);
      const r = await auth.call("/auth/v1/user", { headers: { Authorization: "Bearer " + rec.access_token } });
      const user = r.ok ? await r.json() : null;
      wipeLocal();
      auth.save({ ...rec, user });
      onDone();
    } catch (x) { setErr(authErr(x)); setBusy(false); }
  }
  return html`<${AuthShell} title="Nouveau mot de passe" sub="Choisis ton nouveau mot de passe. Tu resteras connecté sur cet appareil.">
    <form onSubmit=${submit} class="flex flex-col gap-4" noValidate>
      <div class="flex flex-col gap-1.5">
        <label class="eyebrow" htmlFor="np-pw">Nouveau mot de passe</label>
        <input id="np-pw" type="password" autoComplete="new-password" value=${pw} onInput=${(e) => setPw(e.target.value)} class=${OINPUT} placeholder="8 caractères minimum" />
      </div>
      ${err && html`<p class="text-sm" style=${{ color: "var(--red)" }}>${err}</p>`}
      <button id="np-submit" type="submit" disabled=${busy} class=${BTN} style=${{ background: "var(--brass)" }}>${busy && html`<${Spinner} />`} Enregistrer</button>
    </form>
  <//>`;
}

const SYNC_LABEL = { ok: "Synchronisé", pending: "Modifications en attente…", saving: "Enregistrement…", offline: "Hors ligne : nouvel essai automatique", auth: "Session expirée : recharge la page" };
function AccountMenu({ onReset }) {
  const [open, setOpen] = useState(false);
  const [st, setSt] = useState(sync.status);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  useEffect(() => { sync.listeners.add(setSt); return () => sync.listeners.delete(setSt); }, []);
  const email = ((auth.session() || {}).user || {}).email || "";
  const dot = st === "ok" ? "var(--ok)" : st === "offline" || st === "auth" ? "var(--red)" : "var(--brass)";
  async function del() {
    const t = window.prompt("Suppression définitive du compte et de toutes tes données (calendrier, cours, tests). Tape SUPPRIMER pour confirmer :");
    if ((t || "").trim().toUpperCase() !== "SUPPRIMER") return;
    setBusy(true); setErr("");
    try { await auth.deleteAccount(); } catch (x) { setErr(x.code === "auth" ? SYNC_LABEL.auth : "La suppression a échoué. Réessaie ou écris à mentorjuris.contact@gmail.com."); setBusy(false); }
  }
  return html`<div class="fixed bottom-3 right-3 z-40 flex flex-col items-end gap-2">
    ${open && html`<div id="acct-panel" class="w-72 rounded-xl border border-line p-4 flex flex-col gap-3 text-sm" style=${{ background: "var(--panel)" }}>
      <div class="flex flex-col gap-0.5">
        <span class="eyebrow">Compte</span>
        <span class="truncate">${email}</span>
        <span id="acct-sync" class="text-xs text-muted flex items-center gap-1.5"><span class="sq" style=${{ background: dot }}></span>${SYNC_LABEL[st]}</span>
      </div>
      <button type="button" onClick=${() => { setOpen(false); onReset(); }} class="text-left text-muted hover:text-txt">Refaire la configuration</button>
      <button type="button" id="acct-logout" disabled=${busy} onClick=${() => { setBusy(true); auth.signOut(); }} class="text-left text-muted hover:text-txt">Se déconnecter</button>
      <button type="button" id="acct-delete" disabled=${busy} onClick=${del} class="text-left hover:brightness-110" style=${{ color: "var(--red)" }}>Supprimer mon compte</button>
      ${err && html`<p class="text-xs" style=${{ color: "var(--red)" }}>${err}</p>`}
    </div>`}
    <button id="acct-btn" type="button" onClick=${() => setOpen((o) => !o)} aria-expanded=${open} class="mono text-[11px] px-2.5 py-1.5 rounded-lg border border-line text-dim hover:text-muted flex items-center gap-1.5" style=${{ background: "var(--ink)" }}>
      <span class="sq" style=${{ background: dot }}></span>Compte</button>
  </div>`;
}

function Root() {
  const [rec] = useState(readRecovery);
  const [phase, setPhase] = useState(() => rec && rec.access_token ? "recovery" : auth.session() ? "loading" : "auth");
  const [profile, setProfile] = useState(null);
  const [loadErr, setLoadErr] = useState("");

  useEffect(() => {
    if (phase !== "loading") return;
    setLoadErr("");
    sync.pull().then(() => { setProfile(store.get("mj_profile", null)); setPhase("app"); })
      .catch((e) => { if (e.code === "auth") { wipeLocal(); setPhase("auth"); } else setLoadErr(e.code === "network" ? AUTH_ERRORS.network : "Impossible de récupérer tes données pour le moment."); });
  }, [phase]);

  if (phase === "recovery") return html`<${NewPassword} rec=${rec} onDone=${() => setPhase("loading")} />`;
  if (phase === "auth") return html`<${AuthScreen} onIn=${() => setPhase("loading")} notice=${rec && rec.error ? "Ce lien a expiré ou a déjà servi. Redemande un e-mail depuis « Mot de passe oublié »." : ""} />`;
  if (phase === "loading") return html`<div class="min-h-screen grid place-items-center px-4">
    ${loadErr
      ? html`<div class="flex flex-col items-center gap-3 text-sm text-center"><p class="text-muted">${loadErr}</p>
          <div class="flex gap-2"><button type="button" onClick=${() => { setPhase("x"); setTimeout(() => setPhase("loading")); }} class=${BTN} style=${{ background: "var(--brass)" }}>Réessayer</button>
          <button type="button" onClick=${() => auth.signOut()} class="mono text-sm px-4 py-2.5 text-muted hover:text-txt">Se déconnecter</button></div></div>`
      : html`<div class="flex items-center gap-2 text-muted text-sm"><${Spinner} /> Récupération de tes données…</div>`}
  </div>`;
  if (phase !== "app") return null;

  if (!profile || !Array.isArray(profile.matieres)) return html`<${React.Fragment}><${Onboarding} onDone=${setProfile} /><${AccountMenu} onReset=${() => {}} /><//>`;
  applyProfileContext(profile);
  const reset = () => {
    if (!confirm("Refaire la configuration ? Ton calendrier actuel sera remplacé. Tes notes de cours sont conservées.")) return;
    store.set("mj_profile", null);
    store.set("mj_items", []);
    setProfile(null);
  };
  return html`<${React.Fragment}>
    <${App} />
    <${AccountMenu} onReset=${reset} />
  <//>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${Root} />`);
</script>
</body>
</html>
